<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Explainer engine</title>
<meta name="viewport" content="width=960">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&display=block" rel="stylesheet">
<style>
/* Explainer scene engine: one storyboard JSON in, a deterministic 960x540 stage out.
   setTime(t) is a pure function of t, so the renderer can grab any frame in any order. */
:root{--bg:#F5F4FA;--line:#E3E0EE;--ink:#18172B;--mut:#6B6882;--v:#6D28D9;--vs:#EDE9FE;--deep:#1E1B4B;
--g:#15803D;--gs:#DCFCE7;--a:#B45309;--as:#FEF3C7;--r:#B91C1C;--rs:#FEE2E2;--lav:#C4B5FD}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:960px;height:540px;overflow:hidden;background:var(--bg)}
body{font-family:Geist,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
b{font-weight:600}
#stage{position:relative;width:960px;height:540px;overflow:hidden;background:var(--bg)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
svg.i{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* title and closing cards */
.card-full{position:absolute;inset:0;color:#fff;padding:0 78px;display:flex;flex-direction:column;justify-content:center;
background:radial-gradient(circle at 84% 20%,rgba(139,92,246,.42),transparent 36%),radial-gradient(circle at 8% 100%,rgba(192,38,211,.22),transparent 42%),linear-gradient(135deg,#1E1B4B,#2E1065 62%,#312E81)}
.card-full .k{font:500 12px 'Geist Mono';letter-spacing:.16em;text-transform:uppercase;color:var(--lav);margin-bottom:16px}
.card-full h1{font:300 58px/1.04 'Source Serif 4',Georgia,serif;letter-spacing:-.01em;margin-bottom:16px;max-width:780px}
.card-full h2{font:300 46px/1.08 'Source Serif 4',Georgia,serif;margin-bottom:16px;max-width:800px}
.card-full p{font-size:19px;line-height:1.45;color:rgba(255,255,255,.84);max-width:690px;margin-bottom:24px}
.card-full p b{color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:9px}
.pl{font-size:13.5px;font-weight:600;padding:7px 15px;border-radius:999px}
.pl.r{background:#EF4444;color:#fff}.pl.a{background:#F59E0B;color:#1B1405}.pl.g{background:#10B981;color:#04140D}.pl.v{background:#8B5CF6;color:#fff}
.pl.o{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff}
.card-full .ft{position:absolute;left:78px;bottom:40px;font:500 12px 'Geist Mono';letter-spacing:.06em;color:var(--lav)}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(196,181,253,.18)}

/* step chips */
#chips{position:absolute;left:16px;top:14px;display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:6px;height:26px;padding:0 11px 0 4px;border-radius:13px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--mut);white-space:nowrap}
.chip i{width:18px;height:18px;border-radius:50%;background:#EEEDF4;font-style:normal;font-size:10.5px;display:grid;place-items:center;font-weight:600}
.chip.on{background:var(--v);border-color:var(--v);color:#fff}.chip.on i{background:#fff;color:var(--v)}
.chip.done{background:var(--vs);border-color:#DDD6FE;color:var(--v)}.chip.done i{background:var(--v);color:#fff}
#brand{position:absolute;right:18px;top:21px;font:500 10.5px 'Geist Mono';letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
#brand b{color:var(--v);font-weight:600}

/* front door (chat / workspace) */
#front{position:absolute;left:16px;top:54px;width:290px;height:398px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.fh{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line)}
.fh .ap{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#7C3AED,#C026D3);display:grid;place-items:center;color:#fff;flex:none}
.fh b{font-size:13px;display:block}.fh span{font-size:10.5px;color:var(--mut)}
.ftabs{display:flex;gap:5px;padding:8px 12px 0}
.ftabs span{font-size:10.5px;padding:3px 8px;border-radius:6px;background:#F1F0F7;color:var(--mut)}
.ftabs span:first-child{background:var(--vs);color:var(--v);font-weight:500}
.msgs{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;padding:10px 12px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent 0,#000 34px);mask-image:linear-gradient(transparent 0,#000 34px)}
.m{max-width:90%;font-size:12px;line-height:1.4;flex:none}
.m.user{align-self:flex-end;background:var(--v);color:#fff;padding:8px 11px;border-radius:12px 12px 3px 12px}
.m.bot{align-self:flex-start;background:#F3F2F9;padding:8px 11px;border-radius:12px 12px 12px 3px}
.m.bot b{color:var(--v)}
.m.status{align-self:flex-start;color:var(--mut);font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.m.file{align-self:flex-end;display:flex;align-items:center;gap:6px;border:1px solid #DDD6FE;background:#FAF8FF;border-radius:8px;padding:5px 9px;font-size:11px;color:var(--v);font-weight:500}
.m.note{align-self:center;font-size:10.5px;color:var(--g);font-weight:600}
.m.card{align-self:stretch;max-width:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 4px 14px rgba(30,27,75,.08)}
.m.card .ch{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 10px;background:#FAF9FD;border-bottom:1px solid var(--line);font-weight:600;font-size:11.5px}
.badge{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.badge.g{background:var(--gs);color:var(--g)}.badge.a{background:var(--as);color:var(--a)}.badge.r{background:var(--rs);color:var(--r)}.badge.v{background:var(--vs);color:var(--v)}
.m.card .rw{display:flex;justify-content:space-between;gap:10px;padding:3px 10px;font-size:10.5px}
.m.card .rw:first-of-type{padding-top:6px}
.m.card .rw span{color:var(--mut);flex:none}.m.card .rw b{text-align:right}
.m.card .act{display:flex;gap:6px;padding:8px 10px 9px}
.btn{font-size:10.5px;font-weight:600;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:#fff}
.btn.p{background:var(--g);border-color:var(--g);color:#fff}
.btn.p.done{background:var(--gs);color:var(--g);border-color:#BBF7D0}
.m.card .ok{padding:0 10px 9px;font-size:10.5px;color:var(--g);font-weight:600}
.finput{margin:0 10px 10px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:11.5px;color:#A3A0B5;display:flex;justify-content:space-between;align-items:center}

/* the boundary and its component tiles */
#zone{position:absolute;left:318px;top:64px;width:626px;height:388px;border:1.5px dashed #A78BFA;border-radius:16px;background:rgba(237,233,254,.28)}
#zone .zl{position:absolute;top:-10px;left:16px;background:var(--bg);padding:0 8px;font:600 10.5px 'Geist Mono';display:flex;gap:6px;align-items:center;color:var(--v);letter-spacing:.06em;text-transform:uppercase}
#tiles{position:absolute;left:14px;right:14px;top:18px;display:flex;gap:8px}
.tile{flex:1;min-width:0;height:72px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 9px 8px;position:relative}
.tile .tr{display:flex;gap:7px;align-items:center;margin-bottom:5px}
.tile .ti{width:24px;height:24px;border-radius:7px;background:var(--vs);color:var(--v);display:grid;place-items:center;flex:none}
.tile b{font-size:11.5px;line-height:1.15}
.tile{overflow:hidden}.tile span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:9.5px;color:var(--mut);line-height:1.25}
.tile.lit{border-color:var(--v);box-shadow:0 0 0 3px rgba(139,92,246,.18);transform:translateY(-2px);background:#FDFCFF}
.tile.lit .ti{background:var(--v);color:#fff}
.tile .pg{position:absolute;inset:-2px;border-radius:13px;border:2px solid #8B5CF6;opacity:0;pointer-events:none}
#work{position:absolute;left:14px;top:104px;width:598px;height:270px}
.scene{position:absolute;inset:0}

/* caption */
#cap{position:absolute;left:16px;right:16px;top:464px;height:62px;background:var(--deep);border-radius:13px}
.cp{position:absolute;inset:0;display:flex;align-items:center;padding:0 20px;gap:14px}
.cn{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#C026D3);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13.5px;flex:none}
.ct{font-size:16.5px;color:#fff;line-height:1.3}.ct b{color:#D8B4FE}

/* work renderers */
.w-card{position:absolute;background:#fff;border:1px solid var(--line);border-radius:11px}
.dchip{position:absolute;width:150px;height:36px;display:flex;align-items:center;gap:7px;padding:0 10px;background:#fff;border:1px solid var(--line);border-radius:9px;font-size:11.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden}
.dchip svg{color:var(--v);flex:none}
.dtarget{position:absolute;left:378px;top:58px;width:206px;height:150px;border-radius:14px;background:var(--deep);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:0 14px}
.dtarget b{font-size:14px}.dtarget span{font-size:11px;color:var(--lav);line-height:1.35}
.dtarget svg{color:var(--lav)}
.crow{position:absolute;left:0;height:50px;display:flex;align-items:center;gap:11px;padding:0 12px;background:#fff;border:1px solid var(--line);border-radius:11px}
.crow .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.crow small{display:block;font:600 9.5px 'Geist Mono';letter-spacing:.08em;color:var(--mut);text-transform:uppercase;margin-bottom:2px}
.crow p{font-size:12.5px;line-height:1.25}
.verdict{position:absolute;right:0;top:0;width:228px;border-radius:13px;background:var(--deep);color:#fff;padding:16px 16px 18px}
.verdict small{display:block;font:600 9.5px 'Geist Mono';letter-spacing:.1em;color:var(--lav);text-transform:uppercase;margin-bottom:8px}
.verdict h4{font:400 24px/1.12 'Source Serif 4',Georgia,serif;margin-bottom:8px}
.verdict p{font-size:11.5px;line-height:1.4;color:rgba(255,255,255,.78)}
.verdict.g{background:#064E3B}.verdict.g small{color:#6EE7B7}
.verdict.a{background:#78350F}.verdict.a small{color:#FCD34D}
.verdict.r{background:#7F1D1D}.verdict.r small{color:#FCA5A5}
.hubc{position:absolute;width:112px;height:112px;border-radius:50%;background:var(--deep);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 8px rgba(139,92,246,.14)}
.hubc b{font-size:13px}.hubc span{font-size:10px;color:var(--lav);margin-top:2px;padding:0 8px;line-height:1.2}
.spk{position:absolute;width:176px;text-align:center}
.spk .sp{display:flex;align-items:center;gap:7px;justify-content:center;background:#fff;border:1.5px solid #C4B5FD;border-radius:999px;padding:7px 10px;font-size:11.5px;font-weight:600}
.spk .sp i{width:9px;height:9px;border-radius:50%;background:var(--v);flex:none}
.spk .ev{font-size:10.5px;color:var(--g);font-weight:500;margin-top:4px}
.spk .ev.a{color:var(--a)}.spk .ev.r{color:var(--r)}
.cnode{position:absolute;width:104px;height:62px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 8px;text-align:center}
.cnode b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px;line-height:1.15}.cnode span{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;font-size:9.5px;color:var(--mut);line-height:1.2;margin-top:3px}
.cnode.on{border-color:var(--v);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.cnode.done{border-color:#C4B5FD;background:#FAF8FF}
.cnode .ck{position:absolute;top:-7px;right:-7px;width:17px;height:17px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center}
.lane{position:absolute;top:0;bottom:0;border-radius:12px;background:#fff;border:1px solid var(--line);overflow:hidden}
.lane .lh{padding:9px 11px;border-bottom:1px solid var(--line)}
.lane .lh b{font-size:12.5px;display:flex;align-items:center;gap:6px}.lane .lh b i{width:9px;height:9px;border-radius:50%}
.lane .lh span{display:block;font-size:10px;color:var(--mut);margin-top:2px;line-height:1.25}
.litem{position:absolute;left:9px;right:9px;height:30px;border-radius:8px;display:flex;align-items:center;padding:0 9px;font-size:11px;font-weight:500;gap:6px;white-space:nowrap;overflow:hidden}
.logp{position:absolute;inset:0;background:#FCFBFF;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.logp .lt{font:600 10px 'Geist Mono';letter-spacing:.1em;color:var(--v);text-transform:uppercase;margin-bottom:10px;display:flex;gap:6px;align-items:center}
.logp .ll{font:400 11.5px/1.25 'Geist Mono';color:var(--ink);white-space:pre;margin-bottom:7.5px;overflow:hidden}
.logp .ll em{font-style:normal;color:var(--v)}.logp .ll.ok{color:var(--g)}
.stat{position:absolute;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.stat .n{font:600 30px/1 Geist;color:var(--v);letter-spacing:-.01em;margin-bottom:7px}
.stat .l{font-size:12px;font-weight:600;line-height:1.25}.stat .s{font-size:10px;color:var(--mut);margin-top:3px;line-height:1.25}
.qsrc,.qdr{position:absolute;top:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qh{display:flex;align-items:center;gap:7px;padding:8px 11px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600}
.qh svg{color:var(--v)}.qh em{font-style:normal;margin-left:auto;font:500 9.5px 'Geist Mono';color:var(--mut)}
.qb{padding:10px 12px;font-size:11px;line-height:1.55;color:#5B5873}
.qb .hl{color:var(--ink);background-repeat:no-repeat;background-image:linear-gradient(#FDE68A,#FDE68A);border-radius:3px}
.qb .qt{color:var(--v);font-weight:600;border-bottom:1.5px solid #C4B5FD}
.cite{display:inline-block;font:500 9.5px 'Geist Mono';background:var(--vs);color:var(--v);padding:1px 6px;border-radius:5px;margin-left:3px}
.okb{position:absolute;display:flex;align-items:center;gap:7px;background:var(--gs);color:var(--g);font-size:11.5px;font-weight:600;padding:7px 11px;border-radius:9px;border:1px solid #BBF7D0}
.okb.r{background:var(--rs);color:var(--r);border-color:#FECACA}
.page{position:absolute;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(30,27,75,.1)}
.page .ph{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600}
.page .wd{width:20px;height:20px;border-radius:4px;background:#2B579A;color:#fff;font:700 11px Geist;display:grid;place-items:center}
.sec{position:absolute;left:16px;right:16px}
.sec h5{font-size:11px;font-weight:600;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
.bar{height:6px;border-radius:3px;background:#ECEAF3;margin-bottom:4px;overflow:hidden}.bar i{display:block;height:100%;background:#C9C5DA;border-radius:3px}
.lvl{position:absolute;left:0;height:44px;border-radius:10px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px}
.lvl .ln{font:600 11px 'Geist Mono';color:var(--mut);width:22px}
.lvl b{font-size:12px}.lvl span{font-size:10.5px;color:var(--mut)}
.lvl.on{border-color:var(--v);background:#FAF8FF}.lvl.on .ln{color:var(--v)}
.mtr{position:absolute;left:0;right:0;height:56px}
.mtr .mh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.mtr .mh span{color:var(--mut);font-size:11px}
.mtr .tk{position:relative;height:14px;border-radius:7px;background:#ECEAF3}
.mtr .tk i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.mtr .tk u{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;border-left:1px dashed #8D89A6}
.mtr .tk em{position:absolute;top:18px;font:500 9.5px 'Geist Mono';color:var(--mut);font-style:normal;transform:translateX(-50%)}
.stamp{position:absolute;border:2.5px solid var(--r);color:var(--r);font:700 15px Geist;letter-spacing:.06em;padding:6px 12px;border-radius:8px;text-transform:uppercase;background:#fff}

.scr{position:absolute;inset:0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.scr .sb{height:28px;background:#1B2A4A;color:#fff;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:11px;font-weight:600}
.scr .sb em{margin-left:auto;font:500 9.5px 'Geist Mono';font-style:normal;background:#FDE68A;color:#713F12;padding:2px 7px;border-radius:4px}
.scr .nv{position:absolute;left:0;top:28px;bottom:0;width:128px;background:#F6F7FB;border-right:1px solid var(--line);padding:8px 0}
.scr .nv div{font-size:10.5px;padding:5px 12px;color:#4B4866}
.scr .mn{position:absolute;left:128px;right:0;top:28px;bottom:0;padding:9px 12px}
.scr .tb{display:flex;gap:6px;margin-bottom:9px}
.scr .tb span{font-size:10px;padding:4px 8px;border:1px solid var(--line);border-radius:5px;color:#3B3756;background:#fff}
.scr .gh,.scr .gr{display:grid;grid-template-columns:90px 1fr 70px 80px;gap:8px;font-size:10px;padding:5px 8px}
.scr .gh{color:var(--mut);font-weight:600;border-bottom:1px solid var(--line)}
.scr .gr{border-bottom:1px solid #F0EEF6;color:#3B3756}
.scr .hl-box{position:absolute;border:2px solid #C026D3;border-radius:6px;box-shadow:0 0 0 4px rgba(192,38,211,.15);pointer-events:none}
.scr .tip{position:absolute;width:210px;background:#111827;color:#fff;border-radius:8px;padding:8px 10px;font-size:10.5px;line-height:1.35}
.scr .tip small{display:block;font:600 8.5px 'Geist Mono';letter-spacing:.08em;color:#FDE68A;margin-bottom:3px;text-transform:uppercase}
.scr .dlg{position:absolute;left:200px;top:70px;width:250px;background:#fff;border:1px solid #CBD5E1;border-radius:8px;box-shadow:0 12px 30px rgba(15,23,42,.25)}
.scr .dlg .dh{padding:8px 10px;font-size:11px;font-weight:600;border-bottom:1px solid var(--line)}
.scr .dlg .db{padding:8px 10px;font-size:10.5px;display:flex;justify-content:space-between;color:#3B3756}
.scr .dlg .df{display:flex;justify-content:flex-end;gap:6px;padding:8px 10px}
.scr .dlg .df span{font-size:10px;padding:4px 10px;border-radius:5px;border:1px solid var(--line)}
.scr .dlg .df span.ok{background:#1B2A4A;color:#fff;border-color:#1B2A4A}
.scr .cur{position:absolute;width:16px;height:20px;pointer-events:none}
.cmp-h{position:absolute;top:0;width:250px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.cmp-h span{font-weight:400;color:var(--mut);font-size:10.5px}
.cmp-c{position:absolute;width:250px;height:38px;background:#fff;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;padding:0 10px;font-size:11.5px;gap:6px}
.cmp-c em{margin-left:auto;font:500 9.5px 'Geist Mono';font-style:normal;color:var(--v);background:var(--vs);padding:1px 6px;border-radius:4px}
.cmp-c.miss{border-style:dashed;color:var(--mut);background:transparent}
.cmp-s{position:absolute;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.sumt{position:absolute;left:0;top:0;width:350px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sumt .qh{border-bottom:1px solid var(--line)}
.sumr{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;font-size:11px;border-bottom:1px solid #F0EEF6}
.sumr b{font:500 12px 'Geist Mono'}
.sumr.warn{background:var(--as);color:var(--a)}.sumr.tot{background:#FAF9FD;font-weight:600}
.sumr .tg{font:600 9px 'Geist Mono';letter-spacing:.06em;text-transform:uppercase}
.sumh{position:absolute;right:0;top:0;width:228px;border-radius:13px;padding:16px;color:#fff}
.sumh small{display:block;font:600 9.5px 'Geist Mono';letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;opacity:.8}
.sumh .big{font:600 30px/1 'Geist Mono';margin-bottom:10px}
.sumh p{font-size:11.5px;line-height:1.4;opacity:.85}

const ic=(n,s=16,w=2)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" style="stroke-width:${w}">${ICONS[n]||ICONS.dot}</svg>`;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const prog=(t,a,d)=>clamp((t-a)/d);

function stIcon(el,state,t){

    if(el.dataset.s!=='wait'){el.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#DDD9EA" stroke-width="3"/><path d="M12 4a8 8 0 0 1 8 8" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/></svg>';el.dataset.s='wait'}
    el.firstChild.style.transform=`rotate(${a}deg)`;return}
  const [bg,fg,n]=ST[state]||ST.info;el.style.background=bg;el.style.color=fg;
  if(el.dataset.s!==state){el.innerHTML=ic(n,15,2.6);el.dataset.s=state}
}

W.hub=(w,root)=>{

  const sp=w.spokes.map((s,i)=>{const a=(s.ang!=null?s.ang:st+i*360/N)*Math.PI/180,x=CX+RX*Math.cos(a),y=CY+RY*Math.sin(a);
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');ln.setAttribute('x1',CX);ln.setAttribute('y1',CY);ln.setAttribute('stroke','#8B5CF6');ln.setAttribute('stroke-width','1.6');ln.setAttribute('stroke-dasharray','4 4');svg.append(ln);

    show(s.e,eo(prog(lt,s.at+.35,.35)),6);const ev=s.e.querySelector('.ev');if(ev)ev.style.opacity=eo(prog(lt,s.at+.85,.3))})};

W.chain=(w,root)=>{
  const n=w.nodes.length,per=w.per||Math.min(n,5),rows=Math.ceil(n/per),NW=104,NH=60;
  const gx=(598-per*NW)/(per-1||1),rowY=rows>1?[30,166]:[96];
  const pts=w.nodes.map((nd,i)=>{const r=Math.floor(i/per),k=i%per,x=k*(NW+gx),y=rowY[r]||0;return {x,y,cx:x+NW/2,cy:y+NH/2}});
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width',598);svg.setAttribute('height',270);svg.style.position='absolute';root.append(svg);
  let d='';pts.forEach((p,i)=>{if(!i){d+=`M${p.cx} ${p.cy}`;return}const q=pts[i-1];if(p.y!==q.y){const my=(q.cy+p.cy)/2;d+=` L${q.cx} ${my} L${p.cx} ${my} L${p.cx} ${p.cy}`}else d+=` L${p.cx} ${p.cy}`});
  const base=document.createElementNS('http://www.w3.org/2000/svg','path');base.setAttribute('d',d);base.setAttribute('fill','none');base.setAttribute('stroke','#DDD9EA');base.setAttribute('stroke-width','2');svg.append(base);
  const prg=base.cloneNode();prg.setAttribute('stroke','#7C3AED');prg.setAttribute('stroke-width','2.5');svg.append(prg);
  const tok=document.createElementNS('http://www.w3.org/2000/svg','circle');tok.setAttribute('r','6');tok.setAttribute('fill','#C026D3');tok.setAttribute('stroke','#fff');tok.setAttribute('stroke-width','2');svg.append(tok);
  const nodes=w.nodes.map((nd,i)=>{const e=put(h('div','cnode',`<b>${md(nd.t)}</b>${nd.s?`<span>${md(nd.s)}</span>`:''}<div class="ck">${ic('check',11,3)}</div>`),pts[i].x,pts[i].y);root.append(e);return e});
  const notes=(w.notes||[]).map(o=>{const e=h('div','okb'+(o.c==='r'?' r':''),`${ic(o.c==='r'?'x':'check',13,2.6)}${md(o.t)}`);e.style.left=o.x+'px';e.style.top=o.y+'px';root.append(e);return {e,at:o.at}});
  const L=base.getTotalLength();prg.setAttribute('stroke-dasharray',L);
  const t0=w.start||.6,step=w.step||.55;
  // arc length at each node, measured on the drawn path
  const lens=[0];{let acc=0;for(let i=1;i<pts.length;i++){const p=pts[i],q=pts[i-1];acc+=p.y!==q.y?Math.abs(p.cy-q.cy)+Math.abs(p.cx-q.cx):Math.abs(p.cx-q.cx);lens.push(acc)}}
  return lt=>{const f=(lt-t0)/step;const idx=clamp(Math.floor(f),0,n-1),fr=clamp(f-Math.floor(f));
    let len=f<0?0:f>=n-1?L:lens[idx]+(lens[idx+1]-lens[idx])*eio(fr);prg.setAttribute('stroke-dashoffset',L-len);
    const pt=base.getPointAtLength(len);tok.setAttribute('cx',pt.x);tok.setAttribute('cy',pt.y);tok.style.opacity=(lt>t0-.2&&f<n-1+.6)?1:0;
    nodes.forEach((e,i)=>{show(e,eo(prog(lt,i*.07,.3)),6);e.classList.toggle('on',f>=i-.05&&f<i+.95&&f<n-1+.6);e.classList.toggle('done',f>=i+.95||f>=n-1+.6);e.querySelector('.ck').style.opacity=(f>=i+.95||f>=n-1+.6)?1:0});

};
W.lanes=(w,root)=>{

W.log=(w,root)=>{
  const p=h('div','logp',`<div class="lt">${ic(w.ic||'lock',12,2.4)}${md(w.title||'Audit trail')}</div>`);root.append(p);
  const ls=w.lines.map((l,i)=>{const e=h('div','ll'+(l.ok?' ok':''));p.append(e);return {e,ts:l.ts||'',t:l.t,at:l.at!=null?l.at:.4+i*.62}});
  return lt=>{show(p,eo(prog(lt,0,.35)),0);ls.forEach(l=>{const q=prog(lt,l.at,.55);const n=Math.round((l.t.length)*q);l.e.innerHTML=q<=0?'':`<em>${l.ts}</em>  ${l.t.slice(0,n).replace(/</g,'&lt;')}`})};

W.stats=(w,root)=>{
  const cols=w.cols||3,N=w.items.length,rows=Math.ceil(N/cols),gap=10,cw=(598-gap*(cols-1))/cols,ch=w.h||((w.note?226:270)-gap*(rows-1))/rows;

    const m=String(s.n).match(/^([^0-9]*)([0-9][0-9,]*)(.*)$/);return {e,n:e.querySelector('.n'),s,m,at:s.at!=null?s.at:.3+i*.35}});
  let note=null;if(w.note){note=put(h('div','okb',`${ic('check',13,2.6)}${md(w.note)}`),0,240);root.append(note)}

W.quote=(w,root)=>{
  const sw=w.srcW||262;
  const src=put(h('div','qsrc',`<div class="qh">${ic(w.src.ic||'file',14)}${md(w.src.t)}<em>${w.src.ref||''}</em></div><div class="qb">${w.src.lines.map((l,i)=>i===w.src.hl?`<span class="hl">${md(l)}</span>`:md(l)).join(' ')}</div>`),0,0,sw);root.append(src);

  const hl=src.querySelector('.hl'),body=dr.querySelector('.qb');

  const parts=[];w.draft.text.replace(/\[\[(.+?)\]\]|\{\{(.+?)\}\}|([^\[\{]+)/g,(m,q,c,p)=>{parts.push(q?{q}:c?{c}:{p})});

  const ok=h('div','okb'+(w.check.c==='r'?' r':''),`${ic(w.check.c==='r'?'x':'check',14,2.6)}${md(w.check.t)}`);ok.style.left=(sw+24)+'px';root.append(ok);
  const t1=w.hlAt||.8,t2=w.typeAt||1.7,td=w.typeDur||2.4;
  return lt=>{show(src,eo(prog(lt,0,.35)),6);show(dr,eo(prog(lt,.3,.35)),6);hl.style.backgroundSize=`${eio(prog(lt,t1,.7))*100}% 100%`;
    let n=Math.round(total*prog(lt,t2,td)),html='';for(const x of parts){if(x.c){if(n>0||prog(lt,t2,td)>=1)html+=`<span class="cite">${x.c}</span> `;continue}const s=(x.p||x.q),k=Math.min(n,s.length);n-=k;if(k<=0)break;html+=x.q?`<span class="qt">“${s.slice(0,k)}${k===s.length?'”':''}</span>`:s.slice(0,k)}
    body.innerHTML=html;ok.style.top=(w.check.y||dr.offsetHeight+14)+'px';show(ok,eo(prog(lt,w.check.at||t2+td+.4,.35)),6)};
