<script type="text/plain" id="c-hello" data-lang="python">
# pip install azure-ai-projects azure-identity
# Run `az login` first. Your own Azure identity signs the call, so no API key lives in the code.
import os
from azure.identity import DefaultAzureCredential
from azure.ai.projects import AIProjectClient
from azure.ai.projects.models import PromptAgentDefinition

# Format: https://<resource>.services.ai.azure.com/api/projects/<project>
project = AIProjectClient(
    endpoint=os.environ["FOUNDRY_PROJECT_ENDPOINT"],
    credential=DefaultAzureCredential(),
)

# Save the agent's definition in Foundry. Running this again creates a new version.
project.agents.create_version(
    agent_name="refund-desk",
    definition=PromptAgentDefinition(
        model=os.environ["MODEL_DEPLOYMENT_NAME"],  # your deployment's name
        instructions="You answer questions about Contoso refunds. If unsure, say so.",
    ),
)

# Get an OpenAI-style client pre-bound to that agent, then talk to it.
openai = project.get_openai_client(agent_name="refund-desk")
conversation = openai.conversations.create()

first = openai.responses.create(
    conversation=conversation.id,
    input="Can I get my money back on a yearly plan?",
)
print(first.output_text)

# Same conversation id, so the agent remembers the question above.
followup = openai.responses.create(
    conversation=conversation.id,
    input="And how long do I have?",
)
print(followup.output_text)
</script>
<script type="text/plain" id="c-embed" data-lang="python">
# An embedding turns text into a list of numbers. Similar meaning gives nearby numbers.
from openai import OpenAI
from azure.identity import DefaultAzureCredential, get_bearer_token_provider

token_provider = get_bearer_token_provider(
    DefaultAzureCredential(), "https://ai.azure.com/.default"
)
client = OpenAI(
    base_url="https://YOUR-RESOURCE-NAME.openai.azure.com/openai/v1/",
    api_key=token_provider,
)

response = client.embeddings.create(
    model="text-embedding-3-small",  # your deployment's name
    input="Refunds are available within 30 days.",
)
print(len(response.data[0].embedding))  # 1536 numbers for this model
</script>
<script type="text/plain" id="c-docker" data-lang="dockerfile">
# Dockerfile: the recipe for the box
FROM python:3.12-slim
WORKDIR /app

# Copy requirements first so Docker can reuse this layer when only your code changes
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt
COPY src/ ./src/

# Don't run as root inside the container
RUN useradd --create-home appuser
USER appuser

EXPOSE 8000
CMD ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]

<script type="text/plain" id="c-api" data-lang="python">
# src/main.py: a small web API that puts your agent behind a URL
import os
from azure.ai.projects import AIProjectClient
from azure.identity import DefaultAzureCredential
from fastapi import FastAPI
from pydantic import BaseModel

app = FastAPI()
project = AIProjectClient(
    endpoint=os.environ["FOUNDRY_PROJECT_ENDPOINT"],
    credential=DefaultAzureCredential(),  # uses the container's managed identity in Azure
)
openai = project.get_openai_client(agent_name="refund-desk")


class Question(BaseModel):
    text: str


@app.get("/healthz")
def health():
    return {"status": "ok"}


@app.post("/ask")
def ask(question: Question):
    response = openai.responses.create(input=question.text)
    return {"answer": response.output_text}
</script>

# 2. Build it in Azure and store it in your private registry

  --environment refund-env \
  --image contosoacr.azurecr.io/refund-api:1.0.0 \
  --target-port 8000 --ingress external \
  --min-replicas 0 --max-replicas 5 \

  --registry-server contosoacr.azurecr.io --registry-identity system

<script type="text/plain" id="c-hosted" data-lang="yaml">
# azure.yaml: let Foundry itself run your container as a "hosted agent"
name: refund-desk
services:
  ai-project:
    host: azure.ai.project
  refund-agent:
    host: azure.ai.agent
    project: src/refund-agent
    language: docker
    uses:
      - ai-project
    kind: hosted
    name: refund-agent
    description: Refund agent built with our own code.
    protocols:
      - protocol: responses
        version: 2.0.0
    startupCommand: python main.py
    container:
      resources:
        cpu: "0.25"
        memory: 0.5Gi
</script>

<script type="text/plain" id="c-rag-index" data-lang="python">
# index.py: one-time setup, then run for every new document
# pip install azure-search-documents openai azure-identity
import os
from azure.identity import DefaultAzureCredential, get_bearer_token_provider
from azure.search.documents import SearchClient
from azure.search.documents.indexes import SearchIndexClient
from azure.search.documents.indexes.models import (
    HnswAlgorithmConfiguration, SearchableField, SearchField, SearchFieldDataType,
    SearchIndex, SimpleField, VectorSearch, VectorSearchProfile,
)
from openai import OpenAI

credential = DefaultAzureCredential()
search_endpoint = os.environ["AZURE_SEARCH_ENDPOINT"]
openai = OpenAI(
    base_url=os.environ["AZURE_OPENAI_V1_ENDPOINT"],  # https://<resource>.openai.azure.com/openai/v1/
    api_key=get_bearer_token_provider(credential, "https://ai.azure.com/.default"),
)

# 1. Define the index: the shape of each searchable chunk
index = SearchIndex(
    name="policies",
    fields=[
        SimpleField(name="id", type=SearchFieldDataType.String, key=True),
        SimpleField(name="tenant_id", type=SearchFieldDataType.String, filterable=True),
        SimpleField(name="source", type=SearchFieldDataType.String, filterable=True),
        SearchableField(name="content", type=SearchFieldDataType.String),
        SearchField(
            name="content_vector",
            type=SearchFieldDataType.Collection(SearchFieldDataType.Single),
            searchable=True,
            vector_search_dimensions=1536,  # must match the embedding model
            vector_search_profile_name="default",
        ),
    ],
    vector_search=VectorSearch(
        algorithms=[HnswAlgorithmConfiguration(name="hnsw")],
        profiles=[VectorSearchProfile(name="default", algorithm_configuration_name="hnsw")],
    ),
)
SearchIndexClient(search_endpoint, credential).create_or_update_index(index)


# 2. Chunk: overlapping pieces, so a sentence cut at an edge still appears whole in one piece
def chunk(text, size=1000, overlap=200):
    return [text[i : i + size] for i in range(0, len(text), size - overlap)]


# 3. Embed each chunk and upload it
def index_document(tenant_id, source, text):
    pieces = chunk(text)
    vectors = openai.embeddings.create(model="text-embedding-3-small", input=pieces).data
    docs = [
        {
            "id": f"{tenant_id}-{source}-{n}",
            "tenant_id": tenant_id,
            "source": source,
            "content": piece,
            "content_vector": vector.embedding,
        }
        for n, (piece, vector) in enumerate(zip(pieces, vectors))
    ]
    SearchClient(search_endpoint, "policies", credential).upload_documents(documents=docs)


index_document("acme", "refund-policy-v3", open("refund-policy-v3.txt").read())
</script>
<script type="text/plain" id="c-rag-query" data-lang="python">
# ask.py: retrieve, then generate. This continues index.py, reusing openai, credential and search_endpoint.
from azure.search.documents import SearchClient
from azure.search.documents.models import VectorizedQuery

search = SearchClient(search_endpoint, "policies", credential)


def answer(tenant_id, question):
    # Embed the question with the SAME model you used for the documents
    vector = openai.embeddings.create(
        model="text-embedding-3-small", input=question
    ).data[0].embedding

    # Hybrid search: keywords and vectors together, limited to one customer
    results = search.search(
        search_text=question,
        vector_queries=[
            VectorizedQuery(vector=vector, k_nearest_neighbors=20, fields="content_vector")
        ],
        filter=f"tenant_id eq '{tenant_id}'",
        select=["content", "source"],
        top=4,
    )
    context = "\n\n".join(f"[{r['source']}] {r['content']}" for r in results)

    # Generate, using only what we found
    response = openai.responses.create(
        model="gpt-4o",  # your deployment's name
        instructions=(
            "Answer only from the sources below and cite the [source] you used. "
            "If the sources don't contain the answer, say you don't know.\n\n" + context
        ),
        input=question,
    )
    return response.output_text

# Foundry's docs show no single "GraphRAG" switch, so here is one clean way
# to connect them: put the graph behind an MCP tool, and any Foundry agent can call it.
import subprocess

from mcp.server.fastmcp import FastMCP

mcp = FastMCP("refund-graph")


@mcp.tool()
def ask_graph(question: str, scope: str = "local") -> str:
    """Answer questions that span many documents.
    scope='local' follows links from specific entities.
    scope='global' answers questions about the whole dataset."""
    if scope not in ("local", "global"):
        raise ValueError("scope must be 'local' or 'global'")
    result = subprocess.run(
        ["graphrag", "query", question, "--root", "./refund-graph", "--method", scope],
        capture_output=True, text=True, timeout=120, check=True,
    )
    return result.stdout


if __name__ == "__main__":
    mcp.run(transport="streamable-http")

<script type="text/plain" id="c-agent-loop" data-lang="python">
# The whole idea of an agent, with no cloud and no framework
def run_agent(model, tools, user_message, max_steps=8):
    history = [{"role": "user", "content": user_message}]

    for _ in range(max_steps):  # a hard limit, so a confused agent can't run forever
        decision = model(history, tools)

        if decision["type"] == "answer":
            return decision["text"]

        # The model asked for a tool. YOUR code runs it, not the model.
        tool = tools[decision["tool_name"]]
        result = tool(**decision["arguments"])

        history.append({"role": "assistant", "tool_call": decision})
        history.append({"role": "tool", "content": result})

    return "I couldn't finish this. Passing you to a person."
</script>

import os

from azure.ai.projects import AIProjectClient
from azure.ai.projects.models import MCPTool, PromptAgentDefinition
from azure.identity import DefaultAzureCredential
from openai.types.responses.response_input_param import McpApprovalResponse

with AIProjectClient(
    endpoint=os.environ["FOUNDRY_PROJECT_ENDPOINT"],
    credential=DefaultAzureCredential(),
    allow_preview=True,
) as project:
    tool = MCPTool(
        server_label="refund-tools",
        server_url="https://refund-tools.contoso.example/mcp",
        require_approval="always",  # "always" or "never"
        allowed_tools=["get_invoice", "issue_refund"],  # only these, even if the server has more
        project_connection_id="refund-tools-connection",  # holds the login, so code doesn't
    )

    project.agents.create_version(
        agent_name="refund-desk",
        definition=PromptAgentDefinition(
            model=os.environ["MODEL_DEPLOYMENT_NAME"],
            instructions="Use the refund tools. Never guess an invoice amount.",
            tools=[tool],
        ),
    )

    with project.get_openai_client(agent_name="refund-desk") as openai:
        conversation = openai.conversations.create()
        response = openai.responses.create(
            conversation=conversation.id,
            input="Please refund INV-1042.",
        )

        # The agent stops here and asks permission. Show this to a person, then answer.
        approvals = []
        for item in response.output:
            if item.type == "mcp_approval_request" and item.id:
                print("Agent wants to run:", item.name, item.arguments)
                approved = input("Approve? (y/N): ").strip().lower() == "y"
                approvals.append(
                    McpApprovalResponse(
                        type="mcp_approval_response",
                        approve=approved,
                        approval_request_id=item.id,
                    )
                )

        if approvals:
            response = openai.responses.create(
                conversation=conversation.id, input=approvals
            )
        print(response.output_text)

ENDPOINT = os.environ["CONTENT_SAFETY_ENDPOINT"]
KEY = os.environ["CONTENT_SAFETY_KEY"]  # keep it in Key Vault, or use Entra where you can
URL = f"{ENDPOINT}/contentsafety/text:shieldPrompt?api-version=2024-09-01"

def is_attack(user_text, retrieved_docs):

        URL,
        headers={"Ocp-Apim-Subscription-Key": KEY},
        json={"userPrompt": user_text, "documents": retrieved_docs[:5]},  # up to 5 documents

# domain/refund.py: the business rules. No Azure, no prompts, no HTTP in this file.
from dataclasses import dataclass
from decimal import Decimal
from enum import Enum


@dataclass(frozen=True)
class Money:  # VALUE OBJECT: defined by its value, can't change
    amount: Decimal
    currency: str = "USD"

    def __post_init__(self):
        if self.amount < 0:
            raise ValueError("Money can't be negative")


class RefundStatus(Enum):
    REQUESTED = "requested"
    APPROVED = "approved"
    REJECTED = "rejected"


@dataclass(frozen=True)
class RefundApproved:  # DOMAIN EVENT: a fact, named in the past tense
    refund_id: str
    amount: Money


class RefundPolicy:  # DOMAIN SERVICE: a rule that doesn't belong to one object
    def __init__(self, window_days=30, auto_limit=Decimal("500")):
        self.window_days = window_days
        self.auto_limit = auto_limit

    def can_auto_approve(self, amount: Money, paid_days_ago: int) -> bool:
        return paid_days_ago <= self.window_days and amount.amount <= self.auto_limit


class Refund:  # AGGREGATE: the only door through which a refund's state can change
    def __init__(self, refund_id: str, invoice_id: str, amount: Money):
        self.refund_id = refund_id
        self.invoice_id = invoice_id
        self.amount = amount
        self.status = RefundStatus.REQUESTED

    def approve(self) -> RefundApproved:
        if self.status is not RefundStatus.REQUESTED:
            raise ValueError("Only a requested refund can be approved")
        self.status = RefundStatus.APPROVED
        return RefundApproved(self.refund_id, self.amount)
</script>

# adapters/mcp_tools.py: the agent's tool is a thin door into the domain.
# The model chooses WHEN to call it. The domain decides WHETHER it is allowed.
from decimal import Decimal
from uuid import uuid4

from mcp.server.fastmcp import FastMCP

from app.ports import events, invoices, refunds  # repositories and a publisher, wired at startup
from domain.refund import Money, Refund, RefundPolicy

mcp = FastMCP("refund-tools")
policy = RefundPolicy()


@mcp.tool()
def request_refund(invoice_id: str, amount: str) -> dict:
    """Ask for a refund on an invoice. Returns approved or needs_manager."""
    invoice = invoices.get(invoice_id)
    money = Money(Decimal(amount))
    refund = Refund(str(uuid4()), invoice_id, money)

    if not policy.can_auto_approve(money, invoice.paid_days_ago):
        refunds.save(refund)
        return {"status": "needs_manager", "refund_id": refund.refund_id}

    event = refund.approve()
    refunds.save(refund)
    events.publish(event)  # billing and email react to this, loosely coupled
    return {"status": "approved", "refund_id": refund.refund_id}
</script>

<script type="text/plain" id="c-sec-authz" data-lang="python">
# Never trust arguments the model chooses. The model has read untrusted text.
import re

from pydantic import BaseModel, Field


class Caller(BaseModel):
    """Built ONLY from a verified login token, never from the model's output."""

    user_id: str
    tenant_id: str
    can_refund: bool


class RefundArgs(BaseModel):  # check shape and range before anything runs
    invoice_id: str = Field(pattern=r"^INV-\d{1,8}$")
    amount: float = Field(gt=0, le=10_000)


def issue_refund_tool(caller: Caller, raw_args: dict, invoices) -> dict:
    args = RefundArgs(**raw_args)

    if not caller.can_refund:
        raise PermissionError("This user may not issue refunds")

    # Object-level check: this invoice must belong to the caller's own company.
    invoice = invoices.get(args.invoice_id, tenant_id=caller.tenant_id)
    if invoice is None:
        raise PermissionError("Invoice not found")  # same error, so nothing leaks

    if args.amount > invoice.amount:
        raise ValueError("Can't refund more than was paid")

    return {"status": "pending_approval", "invoice_id": args.invoice_id}


def safe_filter(tenant_id: str) -> str:
    # Stop OData injection, in case an ID is ever built from text
    if not re.fullmatch(r"[a-z0-9-]{1,40}", tenant_id):
        raise ValueError("Bad tenant id")
    return f"tenant_id eq '{tenant_id}'"
</script>

        vector_queries=[VectorizedQuery(

<script type="text/plain" id="c-rp-strangler" data-lang="python">
# Strangler fig: one stable front door, and traffic moves across a little at a time.
import hashlib
import os


def in_rollout(tenant_id: str, percent: int) -> bool:
    # The same tenant always lands on the same side, so nobody flips back and forth
    bucket = int(hashlib.sha256(tenant_id.encode()).hexdigest(), 16) % 100
    return bucket < percent


async def ask(tenant_id: str, question: str, old_system, new_agent, log):
    percent = int(os.environ.get("NEW_AGENT_PERCENT", "0"))

    if in_rollout(tenant_id, percent):
        return await new_agent(tenant_id, question)

    answer = await old_system(tenant_id, question)

    # Shadow mode: also run the new one, log both, and show the user only the old answer.
    if os.environ.get("SHADOW_NEW_AGENT") == "1":
        shadow = await new_agent(tenant_id, question)
        log(old=answer, new=shadow, question=question)

    return answer
</script>

  analogy: "A model is a brilliant new hire with no access to anything. It has read a lot, but it can't see your files, can't touch your systems, and forgets you when the chat ends. Everything else in this course is how you give that hire a desk, a filing cabinet, a set of keys, a rulebook and a manager.",
  why: ["Throughout the course we build one system: the <b>Contoso Refund Desk</b>. It answers refund questions from policy documents, looks up invoices, issues refunds after a person approves, and serves many customer companies from one platform. Every concept you asked about has a job in that system, which makes them much easier to remember."],
  terms: [["LLM", "A large language model. It predicts the next word, extremely well. It holds no memory between calls."], ["Token", "A chunk of a word, roughly. You pay per token, and each model has a limit on how many fit in one request."], ["Prompt", "Everything you send to the model: instructions, history, documents and the question."], ["Embedding", "Text turned into a list of numbers. Texts with similar meaning get nearby numbers. Search is built on this."], ["Tool call", "The model replies with a request such as &quot;run get_invoice&quot;. Your system runs it. The model never runs anything itself."], ["Agent", "A model running in a loop with tools and a goal, so it can take several steps by itself."], ["Region", "The physical part of the world where your cloud resources sit. Availability of models varies by region."], ["Managed identity", "An Azure login that belongs to your app and needs no password. It's the reason you'll see so few API keys here."]],
  flow: [["Subscription", "the billing account"], ["Resource group", "a folder of resources"], ["Foundry resource", "models are deployed here", 1], ["Project", "agents, conversations, evals, connections", 1], ["Your app", "calls the project endpoint"]],
  flowNote: "Microsoft's hierarchy. Model deployments belong to the Foundry resource, and every project under it can reuse them.",
  foundryTitle: "What Foundry is",
  foundry: "<p><b>Microsoft Foundry</b> is the current name for what most people still call Azure AI Foundry, so you'll see both. It brings together a model catalog, the Agent Service that runs agents, guardrails, evaluation and tracing, all under one project and one endpoint.</p><p><b>Watch out for old tutorials.</b> Microsoft keeps a separate &quot;classic&quot; documentation set. If a tutorial shows <code>create_agent</code>, threads and runs, it's classic. Current code uses <code>create_version</code>, conversations and the Responses API, which is what this course teaches. The re-platforming lesson maps one to the other.</p>",
  code: [{ note: "Your first agent, from Microsoft's quickstart. Set FOUNDRY_PROJECT_ENDPOINT and MODEL_DEPLOYMENT_NAME first.", tabs: [["hello_agent.py", "c-hello"], ["embeddings.py", "c-embed"]] }],
  mistakes: ["<b>Confusing model name and deployment name.</b> Your code passes the name you gave the deployment, which might differ from the model's name.", "<b>Following a classic tutorial by accident.</b> Check for threads and runs before you copy any code.", "<b>Treating the model as a database.</b> It can sound sure and still be wrong. Facts should come from your data and tools."],
  spoken: ["Think of a model as a very well-read new hire who has no access to anything. On its own it can write and reason, but it can't see your data or act on your systems.", "Foundry is where I give that hire a job. A Foundry resource holds the model deployments. A project under it holds the agents, their conversations, the evaluations and the connections to tools and data. My app signs in with a managed identity, so there's no key to leak, and it calls one project endpoint."],
  quiz: [{ q: "Where do model deployments live in Foundry?", opts: ["Inside each project", "On the Foundry resource, shared by its projects", "In the resource group"], a: 1, why: "Deployments belong to the Foundry resource, and projects can reuse them." }, { q: "A tutorial uses threads and runs. What does that tell you?", opts: ["It's the newest API", "It's the classic API", "It's written for AWS"], a: 1, why: "Current Foundry code uses conversations and the Responses API." }],
  sources: [["Agents in Foundry", "https://learn.microsoft.com/azure/foundry/agents/overview"], ["Quickstart", "https://learn.microsoft.com/azure/foundry/quickstarts/get-started-code"], ["Runtime components", "https://learn.microsoft.com/azure/foundry/agents/concepts/runtime-components"]]
},
{
  id: "containers", part: 1, title: "Containers", short: "Containers",
  lede: "How to make your agent's code run the same way on your laptop and in the cloud.",
  analogy: "A container is a shipping container for software. Your code, the Python version and every library go in one sealed box. The ship and the crane don't care what's inside, and the box behaves the same at every port. That ends the old excuse: &quot;it works on my machine&quot;.",
  how: ["Write a <b>Dockerfile</b>, the recipe for the box.", "<b>Build</b> it into an image, a frozen snapshot of your app.", "<b>Push</b> the image to a private registry, which is a warehouse for images. On Azure that's Azure Container Registry.", "<b>Run</b> it on a service that starts copies when traffic grows and stops them when it falls."],
  terms: [["Image vs container", "The image is the frozen recipe result. A container is one running copy of it."], ["Registry", "Where images are stored and versioned: ACR on Azure, ECR on AWS."], ["Replica", "One running copy. More traffic, more replicas."], ["Revision", "A saved version of a Container App, which is what makes rollback and canary releases possible."]],
  flow: [["Dockerfile", "the recipe"], ["Image", "frozen build"], ["Container Registry", "the warehouse"], ["Container Apps", "runs and scales it", 1], ["Foundry", "called with managed identity", 1]],
  whereRows: [["Store images", "Azure Container Registry", "Amazon ECR"], ["Run containers, simple", "Azure Container Apps", "App Runner, ECS on Fargate"], ["Run containers, full control", "Azure Kubernetes Service", "Amazon EKS"], ["Run your agent's container for you", "Foundry hosted agents", "Bedrock AgentCore Runtime"]],
  foundryTitle: "Two ways to use containers with Foundry",
  foundry: "<p><b>Your app in a container, calling Foundry.</b> A web API on Container Apps calls a Foundry agent. Use this when you own the front door: login, routing and business logic.</p><p><b>Your agent in a container, run by Foundry.</b> This is a <b>hosted agent</b>. You write the agent with any framework, Foundry runs the container, and you get its versioning, tracing and identity. Use it when the agent needs custom code that a prompt agent can't express. Older docs and samples show different request shapes for this API, so treat the current quickstart as the reference.</p>",
  code: [{ note: "A container for the Refund Desk API, then two ways to deploy it.", tabs: [["Dockerfile", "c-docker"], ["src/main.py", "c-api"], ["deploy (Azure)", "c-aca"], ["hosted: azure.yaml", "c-hosted"], ["hosted: commands", "c-hosted-cmd"], ["AWS: push", "c-ecr"], ["AWS: AgentCore", "c-agentcore"]] }],
  mistakes: ["<b>Secrets baked into the image.</b> Anyone with the image can read them. Pass settings at run time and use managed identity.", "<b>Using the <code>latest</code> tag in production.</b> You can't tell what's running, or roll back. Tag images with the git commit.", "<b>Scale to zero on a user-facing chat.</b> It saves money, but the first caller waits for a cold start. Keep one replica if that matters."],
  spoken: ["A container is a sealed box holding my code and everything it needs, so it runs the same on my laptop and in Azure.", "I build the image, keep it in Azure Container Registry, and run it on Container Apps, which scales replicas up and down and keeps revisions, so rolling back is quick. If the agent itself needs custom code, I package it as a Foundry hosted agent, and Foundry runs the container for me."],
  quiz: [{ q: "When would you choose a Foundry hosted agent over a prompt agent?", opts: ["When you only need instructions and tools", "When the agent needs your own custom code or framework", "When you want no container at all"], a: 1, why: "Prompt agents are declarative. Hosted agents run your code in a container." }, { q: "Why tag images with the git commit, not latest?", opts: ["It builds faster", "You always know what's running and can roll back to it", "Azure requires it"], a: 1, why: "A specific tag ties production to an exact version of your code." }],
  sources: [["Hosted agents", "https://learn.microsoft.com/azure/foundry/agents/concepts/hosted-agents"], ["Deploy your own code", "https://learn.microsoft.com/azure/foundry/agents/quickstarts/quickstart-deploy-own-code"], ["azure.yaml for agents", "https://learn.microsoft.com/azure/foundry/agents/how-to/author-azure-yaml"]]
},
{
  id: "serverless", part: 1, title: "Serverless", short: "Serverless",
  lede: "Run a small piece of code only when something happens, and pay only for that moment.",
  analogy: "A container is like renting a shop: it's yours, and you decide when it opens. Serverless is like calling a plumber: you pay for the visit, not for keeping a plumber in your house. There are still servers, you just never see or manage them.",
  why: ["In an agent system, serverless suits the small jobs that happen now and then: indexing a new policy document when it's uploaded, or running one quick tool for the agent."],
  terms: [["Function", "One small piece of code with one job."], ["Trigger", "What wakes it up: an HTTP call, a new file, a queue message or a timer."], ["Cold start", "The delay when a function wakes from nothing."], ["Timeout", "Functions have time limits, so they're a poor fit for long agent runs."]],
  flow: [["New policy uploaded", "Blob Storage"], ["Trigger fires", "Azure Functions", 1], ["Chunk and embed", "calls an embedding model"], ["Upload", "Azure AI Search"], ["Agent can now find it", "the next question", 1]],
  whereRows: [["Run code on an event", "Azure Functions", "AWS Lambda"], ["Long multi-step workflow", "Durable Functions", "Step Functions"], ["Event routing", "Event Grid", "EventBridge"], ["Queue", "Storage Queues, Service Bus", "SQS"]],
  compare: { title: "Which one should I pick?", head: ["", "Container Apps", "Azure Functions", "Foundry prompt or hosted agent"], rows: [["Best for", "Your API and long-running services", "Small jobs fired by events", "The agent itself"], ["You manage", "The image and scaling rules", "Only the function code", "Instructions and tools, or your agent code"], ["Example here", "The Refund Desk API", "Index a new policy document", "The refund agent"]] },
  foundryTitle: "How serverless connects to Foundry",
  foundry: "<p>A Foundry agent can use Azure Functions as tools in two ways. It has an <b>Azure Functions tool</b> that works through storage queues, and a Functions app can act as a <b>custom MCP server</b> through its <code>/runtime/webhooks/mcp</code> endpoint. The MCP lesson explains why you'd want that.</p>",
  code: [{ note: "Two functions: one reacts to a file, one answers a URL. On the Flex Consumption plan, blob triggers need an Event Grid source.", tabs: [["function_app.py", "c-func"], ["commands", "c-func-cmd"], ["AWS: Lambda", "c-lambda"]] }],
  mistakes: ["<b>Running the whole agent loop in a function.</b> A long model call can hit the timeout. Use a container, or a workflow service.", "<b>Assuming a trigger fires exactly once.</b> Events can repeat, so make your work safe to run twice. Fixed document IDs help here.", "<b>Storing state in memory.</b> The next call may run on a different machine. Keep state in a database."],
  spoken: ["Serverless means I write a small function, say what should wake it up, and pay only while it runs.", "In an agent system I use it for the event-driven edges. When a new policy lands in storage, a function chunks it, embeds it and updates the search index, so the agent knows about it by the next question. The long-running parts stay in containers, because functions have time limits and cold starts."],
  quiz: [{ q: "Which job suits Azure Functions best?", opts: ["Index a document when it's uploaded", "Hold a stateful chat for an hour", "Host your main web app with steady traffic"], a: 0, why: "It's short and event-driven, and it's idle the rest of the time." }, { q: "Why should a function be safe to run twice?", opts: ["To make it faster", "Because events can be delivered more than once", "Because Python requires it"], a: 1, why: "This property is called idempotency. Retried events are normal." }],
  sources: [["Functions tool for agents", "https://learn.microsoft.com/azure/foundry/agents/how-to/tools/azure-functions"], ["MCP servers in Foundry", "https://learn.microsoft.com/azure/foundry/agents/overview#tools-and-toolboxes"]]
},
{
  id: "terraform", part: 1, title: "Infrastructure as code with Terraform", short: "Terraform",
  lede: "Describe your cloud in text files, review changes like code, and rebuild everything on demand.",
  analogy: "Clicking through the Azure portal is like cooking from memory: nobody can repeat it exactly, including you. Terraform is the written recipe. You describe the finished dish, and Terraform compares it with what's in the kitchen and does only what's missing.",
  how: ["<b>Write</b> what you want in <code>.tf</code> files. You state the end result, not the steps.", "<b>Plan.</b> Terraform compares your files with its state file and with Azure, then shows exactly what would change.", "<b>Review</b> that plan like a code change. Watch for anything being destroyed.", "<b>Apply.</b> Terraform makes those changes and updates the state."],
  terms: [["Provider", "The plugin that talks to a cloud: azurerm, azapi or aws."], ["Resource", "One thing to create, such as a Foundry project."], ["State", "Terraform's record of what it built. It can hold secrets, so keep it in secure shared storage."], ["Module", "A reusable bundle of resources, like a function for infrastructure."], ["Drift", "When the real cloud no longer matches your files, usually from a manual change."]],
  flow: [[".tf files", "what you want"], ["terraform plan", "shows the difference", 1], ["You review", "in a pull request"], ["terraform apply", "makes the changes", 1], ["Azure", "plus updated state"]],
  whereRows: [["Terraform providers", "azurerm, azapi", "aws"], ["Native alternative", "Bicep", "CloudFormation, CDK"], ["Store state", "Storage account", "S3 with locking"]],
  foundryTitle: "AzureRM or AzAPI for Foundry?",
  foundry: "<p>Microsoft's guidance: start with <b>AzureRM</b>, which has typed resources and validation and covers the Foundry resource, projects, deployments and connections. Add <b>AzAPI</b> when you need something AzureRM doesn't expose. That includes preview features and the <b>capability host</b> used to bring your own Cosmos DB, AI Search and Storage to the Agent Service.</p><p>Terraform builds the platform: resources, projects and deployments. The agents' definitions are often created by code in your pipeline, although hosted agents can also be registered through AzAPI.</p>",
  code: [{ note: "From Microsoft's Terraform guide, adapted to our example. This course's own files are not applied to a real subscription, so run plan first.", tabs: [["main.tf", "c-tf-foundry"], ["app.tf", "c-tf-app"], ["versions.tf", "c-tf-setup"], ["commands", "c-tf-cmd"], ["AWS", "c-tf-aws"]] }],
  mistakes: ["<b>Committing the state file to git.</b> It can contain secrets. Use a remote backend with access controls.", "<b>Applying without reading the plan.</b> One renamed resource can mean destroy and recreate.", "<b>Hotfixing in the portal.</b> That creates drift, and the next apply may undo it.", "<b>One giant state for everything.</b> Split by environment, so a mistake in dev can't touch production."],
  spoken: ["Terraform lets me describe the cloud I want in text files, so my infrastructure gets reviewed and versioned like any other code.", "I run a plan, which shows exactly what would change, the team reviews it in a pull request, and then apply makes only those changes. For Foundry, the azurerm provider covers the resource, the project and the model deployments, and I reach for azapi when I need preview features or the capability host. The state lives in a locked-down storage account, because it can contain secrets."],
  quiz: [{ q: "What does terraform plan do?", opts: ["Creates the resources", "Shows what would change without changing anything", "Deletes old state"], a: 1, why: "Plan is a preview. Only apply makes changes." }, { q: "You need the capability host for bring-your-own storage. Which provider?", opts: ["AzureRM", "AzAPI", "Either one"], a: 1, why: "Microsoft's provider table lists capability host as AzAPI only." }],
  sources: [["Terraform for Foundry", "https://learn.microsoft.com/azure/foundry/how-to/create-resource-terraform"], ["AzureRM vs AzAPI", "https://learn.microsoft.com/azure/developer/terraform/provider-selection-azurerm-vs-azapi"], ["Foundry Terraform samples", "https://github.com/microsoft-foundry/foundry-samples/tree/main/infrastructure/infrastructure-setup-terraform"]]
},
{
  id: "rag", part: 2, title: "RAG", short: "RAG", demo: "rag",
  lede: "Retrieval-augmented generation: find the right passages first, then ask the model to answer from them.",
  analogy: "It's an open-book exam. Instead of asking the model to answer from memory, you find the three most relevant pages in your own documents and hand them over with the question: &quot;answer from these, and tell me which page you used&quot;.",
  how: ["<b>Chunk.</b> Split documents into small overlapping pieces.", "<b>Embed.</b> Turn each piece into numbers that capture its meaning.", "<b>Index.</b> Store the text and numbers in a search service.", "<b>Retrieve.</b> When a question comes in, embed it and find the closest pieces.", "<b>Generate.</b> Send those pieces and the question to the model, with instructions to answer only from them."],
  terms: [["Vector search", "Finds meaning: &quot;money back&quot; matches &quot;refund&quot;."], ["Keyword search", "Finds exact terms such as an error code or INV-1042."], ["Hybrid search", "Both together, merged into one ranking. It's a strong default."], ["Semantic ranker", "A second pass that reorders the top results by how well they answer the question."], ["Grounding", "Tying an answer to retrieved sources, ideally with citations."]],
  flow: [["Question", ""], ["Embed", "same model as the documents"], ["Azure AI Search", "hybrid, filtered by tenant", 1], ["Top chunks", "with their sources"], ["Model", "answers only from these", 1], ["Answer", "with citations"]],
  whereRows: [["Search index", "Azure AI Search", "OpenSearch Serverless"], ["Embeddings", "Foundry model deployment", "Bedrock Titan or Cohere"], ["Managed RAG", "Foundry IQ knowledge bases", "Bedrock Knowledge Bases"], ["Simple built-in", "File search tool", "Bedrock Knowledge Bases"]],
  foundryTitle: "Three levels of RAG in Foundry",
  foundry: "<p><b>File search tool.</b> The fastest start: upload files to a vector store and attach it to an agent.</p><p><b>Foundry IQ knowledge base.</b> The managed knowledge layer, built on Azure AI Search. One knowledge base can cover several sources, and <b>agentic retrieval</b> splits a hard question into subqueries, runs them in parallel and reranks the results. An agent reaches it as an MCP tool. Parts of this are still in preview.</p><p><b>Your own pipeline with Azure AI Search.</b> Classic RAG, the code below. Choose it for full control over the query, or when you need generally available features only.</p>",
  code: [{ note: "Build it by hand first, so nothing is magic. Then see the managed route.", tabs: [["index.py", "c-rag-index"], ["ask.py", "c-rag-query"], ["Foundry IQ", "c-rag-iq"], ["AWS", "c-rag-aws"]] }],
  mistakes: ["<b>Blaming the model for a retrieval problem.</b> If the right chunk never arrived, no model can answer. Test retrieval on its own first.", "<b>Different embedding models for documents and questions.</b> Their numbers aren't comparable, so results will be meaningless.", "<b>Vector search only.</b> It misses exact terms such as invoice numbers. Use hybrid.", "<b>No access filter.</b> Retrieval must respect who is asking, or the agent becomes a way to read other people's documents."],
  spoken: ["RAG is an open-book exam for the model. Instead of trusting its memory, I find the right passages in our own documents and tell it to answer only from those, with citations.", "I chunk the documents, embed them, and index them in Azure AI Search. At question time I run a hybrid search, keywords and vectors together, filtered to what this user may see. When an answer is wrong, I check retrieval first, because most RAG failures happen before the model is ever called. On Foundry, I start with a Foundry IQ knowledge base and build my own pipeline when I need finer control."],
  quiz: [{ q: "A user searches for INV-1042 and vector search misses it. What helps most?", opts: ["A bigger model", "Hybrid search, which adds keyword matching", "Longer chunks"], a: 1, why: "Exact identifiers are what keyword search is good at." }, { q: "Answers are wrong and the right chunk isn't in the retrieved results. Where's the problem?", opts: ["The model", "Retrieval", "The container"], a: 1, why: "The model can't use what it never received." }],
  sources: [["RAG in Azure AI Search", "https://learn.microsoft.com/azure/search/retrieval-augmented-generation-overview"], ["Foundry IQ", "https://learn.microsoft.com/azure/foundry/agents/concepts/what-is-foundry-iq"], ["Connect an agent to Foundry IQ", "https://learn.microsoft.com/azure/foundry/agents/how-to/foundry-iq-connect"], ["File search tool", "https://learn.microsoft.com/azure/foundry/agents/how-to/tools/file-search"]]
},
{
  id: "graphrag", part: 2, title: "GraphRAG", short: "GraphRAG", demo: "graph",
  lede: "RAG that understands how things connect, so it can answer questions no single passage contains.",
  analogy: "Normal RAG is a librarian who finds the most relevant pages. GraphRAG is a detective with a corkboard: photos joined by string. Ask &quot;who is affected if this policy changes?&quot; and the detective follows the string from the policy to the plan to the customers, even though no single page says so.",
  how: ["<b>Extract.</b> An LLM reads each chunk and pulls out entities, such as a policy or a customer, and how they relate.", "<b>Build a graph.</b> Entities become nodes, and relationships become edges.", "<b>Find communities.</b> An algorithm called Leiden groups closely connected nodes.", "<b>Summarize.</b> The LLM writes a short report for each community.", "<b>Query.</b> Use <b>local</b> search for questions about specific things, and <b>global</b> search for questions about the whole collection."],
  terms: [["Entity / node", "A thing: Refund Policy v3, Enterprise plan, Acme."], ["Relationship / edge", "A link between things: GOVERNS, SUBSCRIBES_TO."], ["Multi-hop", "An answer that needs several links followed in a row."], ["Community report", "An LLM's summary of one cluster, which is what makes global questions possible."]],
  compare: { title: "When is the extra cost worth it?", head: ["", "Normal RAG", "GraphRAG"], rows: [["Good at", "&quot;What does the policy say about X?&quot;", "&quot;What connects X and Y?&quot; and &quot;What are the themes?&quot;"], ["Indexing cost", "Low, embeddings only", "High, because an LLM reads everything"], ["Keeping it fresh", "Easy", "Harder, because the graph needs updating"], ["Start here?", "Yes, nearly always", "Add it when real questions need it"]] },
  whereRows: [["Open-source indexer", "Microsoft GraphRAG library", "Same library works"], ["Graph database", "Neo4j on Azure, Cosmos DB for Apache Gremlin", "Neptune, Neo4j"], ["Managed option", "Neo4j context provider in Agent Framework", "Bedrock Knowledge Bases with Neptune Analytics"]],
  foundryTitle: "How GraphRAG connects to Foundry",
  foundry: "<p>Foundry's docs show no single GraphRAG switch, so you connect it. Two clean routes: put a graph query behind an <b>MCP tool</b> that any Foundry agent can call, or use the <b>Neo4j GraphRAG context provider</b> in Microsoft Agent Framework. A good design often keeps both search types, with normal RAG for most questions and the graph tool for the connected ones. The agent chooses based on your tool descriptions.</p>",
  code: [{ note: "What extraction produces, how to run the library, and how to hand it to an agent.", tabs: [["extracted.json", "c-graph-json"], ["commands", "c-graph-cli"], ["graph_tool.py", "c-graph-mcp"]] }],
  mistakes: ["<b>Starting with GraphRAG.</b> It costs more and is harder to keep fresh. Prove that normal RAG can't answer your real questions first.", "<b>Indexing everything on day one.</b> Try a small sample and check both the cost and the quality of the graph.", "<b>Forgetting access control.</b> A community summary can blend documents a user isn't allowed to read."],
  spoken: ["GraphRAG adds a map of how things connect. An LLM reads the documents and extracts entities and relationships into a graph, then groups them into communities and summarizes each one.", "That lets me answer two kinds of question normal RAG struggles with: multi-hop questions, like which customers a policy change affects, and whole-dataset questions, like what themes run through our complaints. It costs more to build, so I start with hybrid search and add a graph only when real questions need it. On Foundry, I expose it as an MCP tool, and the agent picks the right search for the question."],
  quiz: [{ q: "Which question most needs GraphRAG?", opts: ["What is the refund window?", "Which customers does this policy change affect, across several documents?", "Find invoice INV-1042"], a: 1, why: "It needs links followed across documents." }, { q: "What's GraphRAG's biggest cost?", opts: ["Query speed only", "An LLM reads all your content at indexing time", "It needs GPUs on your laptop"], a: 1, why: "Indexing makes many LLM calls, so try a sample first." }],
  sources: [["GraphRAG docs", "https://microsoft.github.io/graphrag/"], ["GraphRAG CLI", "https://microsoft.github.io/graphrag/cli/"], ["Neo4j provider in Agent Framework", "https://learn.microsoft.com/agent-framework/integrations/by-component/context-providers/neo4j"]]
},
{
  id: "agents", part: 2, title: "Agents", short: "Agents", demo: "agent",
  lede: "A model in a loop: decide, use a tool, look at the result, and repeat until the job is done.",
  analogy: "A chatbot is a phone helpline: it answers and hangs up. An agent is a junior colleague you give a goal to: &quot;sort out this refund&quot;. They check the invoice, read the policy, ask their manager for sign-off, process it and report back, deciding each step from what they just learned.",
  how: ["The model gets the goal, its instructions and a list of tools.", "It either answers, or asks for a tool to be run.", "Your system runs the tool and returns the result.", "The model looks at the result and decides again, up to a limit you set."],
  terms: [["Instructions", "The job description: role, rules, and when to use which tool."], ["Tool", "Something the agent can do, described in words the model can read."], ["Memory", "What it knows across turns. Conversation history is short-term. Facts kept between sessions are long-term."], ["Human in the loop", "The agent stops and waits for a person before a risky step."], ["Multi-agent", "Several specialized agents with a coordinator. Powerful, and harder to debug."]],
  compare: { title: "Three ways to build an agent on Foundry", head: ["", "Prompt agent", "Hosted agent", "Agent elsewhere, calling Foundry"], rows: [["You write", "Instructions and a tool list", "Your own code, in a container", "Your own code on your own hosting"], ["Foundry runs", "Everything", "Your container", "Model and tool calls through the Responses API"], ["Choose it when", "The logic fits in instructions and tools", "You need custom logic or a framework", "You already run agents elsewhere"]] },
  whereRows: [["Managed agent runtime", "Foundry Agent Service", "Bedrock Agents, AgentCore"], ["Code framework", "Microsoft Agent Framework, LangGraph", "Strands, LangGraph"], ["Shared tools", "Foundry toolbox", "AgentCore Gateway"], ["Publish to users", "Teams, Copilot, stable endpoints", "Your own API"]],
  foundryTitle: "How agents work in Foundry",
  foundry: "<p>You save a versioned agent, then call it through the <b>Responses API</b>. For multi-turn chat you pass a conversation ID or the previous response's ID. Foundry hosts the loop for its built-in tools. For a <b>function tool</b> the loop comes back to your code, which runs the function and sends the output back, so you see the mechanism directly.</p><p>Foundry also offers workflows for multi-step orchestration, and server-side traces of every agent run.</p>",
  code: [{ note: "The idea in plain Python, then on Foundry, then with Agent Framework.", tabs: [["the_loop.py", "c-agent-loop"], ["foundry_tool.py", "c-agent-tool"], ["agent_framework.py", "c-agent-fw"]] }],
  mistakes: ["<b>No step limit.</b> A confused agent can loop forever and spend real money.", "<b>Vague tool descriptions.</b> The model picks tools by reading them. A bad description means the wrong tool gets called.", "<b>Too many agents too soon.</b> One agent with good tools beats five that talk past each other. Split only when one agent is really struggling.", "<b>Business rules written only in instructions.</b> Instructions are guidance, not enforcement. Rules that matter belong in code."],
  spoken: ["An agent is a model running in a loop. It's given a goal and some tools, it decides what to do next, a tool runs, it looks at the result, and it decides again until the job is done.", "On Foundry I start with a prompt agent, which is just instructions and tools, and I move to a hosted agent when I need custom code. The part I care most about is what the agent is allowed to do. I cap the steps, I put a person in front of anything that moves money, and I keep the real business rules in code, because instructions are only guidance."],
  quiz: [{ q: "Who actually runs a tool?", opts: ["The model itself", "The surrounding system, after the model asks", "The user"], a: 1, why: "The model only requests. That gap is your control point." }, { q: "When should you move from a prompt agent to a hosted agent?", opts: ["Always, on day one", "When you need custom code that instructions and tools can't express", "When you have more than one user"], a: 1, why: "Start simple and add code when it's needed." }],
  sources: [["Agents overview", "https://learn.microsoft.com/azure/foundry/agents/overview"], ["Agent Framework", "https://learn.microsoft.com/agent-framework/"], ["Prompt agent quickstart", "https://learn.microsoft.com/azure/foundry/agents/quickstarts/prompt-agent"]]
},
{
  id: "mcp", part: 2, title: "MCP servers", short: "MCP servers",
  lede: "A standard plug between AI agents and tools, so you build a tool once and any agent can use it.",
  analogy: "Before USB, every device needed its own cable. MCP, the Model Context Protocol, is USB for AI tools. Write one MCP server around your invoice system, and any MCP-capable agent can plug in, whether it runs on Foundry, on Bedrock, or inside a coding assistant.",
  how: ["An <b>MCP server</b> wraps your system and lists the tools it offers.", "An <b>MCP client</b>, inside the agent platform, connects and asks what's available.", "The model sees the tool names and descriptions and chooses one.", "The client calls the server. If approval is required, a person says yes first.", "The result goes back to the model."],
  terms: [["Tool", "An action the model can call, such as get_invoice."], ["Resource", "Read-only data the server can offer."], ["Prompt", "A reusable prompt template the server can offer."], ["Streamable HTTP", "The usual way to reach a remote MCP server over the web."], ["Toolbox", "Foundry's versioned, shared bundle of tools behind one MCP endpoint."]],
  flow: [["Foundry agent", "MCP client", 1], ["Project connection", "holds the login"], ["Approval?", "a person, for risky tools"], ["Your MCP server", "on Container Apps or Functions", 1], ["Invoice system", ""]],
  whereRows: [["Host the server", "Container Apps, Azure Functions", "Lambda, AgentCore Runtime"], ["Share tools across agents", "Foundry toolbox", "AgentCore Gateway"], ["Hold credentials", "Project connections", "AgentCore Identity"]],
  foundryTitle: "How MCP works in Foundry",
  foundry: "<p>Add an <b>MCPTool</b> to an agent with the server's URL, an <code>allowed_tools</code> list, and <code>require_approval</code>, which is <code>always</code> or <code>never</code>. When approval is on, the response contains an <code>mcp_approval_request</code> and the agent waits for your answer.</p><p>Microsoft now recommends a <b>toolbox</b> for sharing tools, because you curate them once and govern them in one place. Authentication options include key-based access, Entra with the agent's or project's managed identity, and OAuth identity passthrough so the agent acts as the signed-in user.</p>",
  code: [{ note: "A real server, a Foundry agent using it with approval, and a shared toolbox.", tabs: [["refund_tools.py", "c-mcp-server"], ["agent_with_mcp.py", "c-mcp-foundry"], ["toolbox.py", "c-mcp-toolbox"]] }],
  mistakes: ["<b>Connecting a server you don't trust.</b> Tool descriptions and results reach your model, and they can carry hidden instructions.", "<b>Turning approval off for everything.</b> Reads can be automatic. Anything that writes or moves money should stop for a person.", "<b>Exposing every tool.</b> Use <code>allowed_tools</code>. A long list also makes the model choose worse.", "<b>An MCP server with no login.</b> It's a public door into your systems."],
  spoken: ["MCP is a standard plug between agents and tools. I wrap a system like invoicing in one MCP server, and any agent that speaks MCP can use it, so I'm not rewriting integrations for each framework.", "In Foundry I attach it as an MCP tool, and I limit it to the tools that agent actually needs. Reads run automatically, and anything that changes data needs approval, so the agent pauses until a person says yes. The credentials live in a project connection rather than in my code, and I'd share tools across teams through a toolbox."],
  quiz: [{ q: "What problem does MCP solve?", opts: ["It makes models smarter", "It gives one standard way to connect agents and tools", "It replaces your database"], a: 1, why: "Build the tool once, and use it from many agents." }, { q: "What does require_approval=\"always\" do?", opts: ["Blocks the tool permanently", "Pauses so a person can approve each call", "Logs the call and continues"], a: 1, why: "The response carries an approval request and the agent waits." }],
  sources: [["MCP tool in Foundry", "https://learn.microsoft.com/azure/foundry/agents/how-to/tools/model-context-protocol"], ["Toolbox overview", "https://learn.microsoft.com/azure/foundry/agents/concepts/toolbox-overview"], ["Hosted MCP in Agent Framework", "https://learn.microsoft.com/agent-framework/agents/tools/hosted-mcp-tools"]]
}
];
