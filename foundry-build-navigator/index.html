<title>Foundry Build Navigator</title>
<style>
/* Layout concept: a route chart for one build. Steps down the left, the prompt and its options side by side, then a preview of what runs next. The nine-layer gradient is the page's one signature. */
:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1A25; --surface: #15242F; --sunk: #1B2D3A; --line: #2A3F4E; --fg: #E4EDF3; --muted: #9DB1C0;
  --navy: #BBD6EA; --blue: #6DB9D6; --teal: #63C9BA; --accent: #6DB9D6; --accent-soft: #1B3341;
  --ok: #63CFA8; --ok-soft: #173A30; --warn: #E3B860; --warn-soft: #3B2F18; --bad: #EE9A9A; --bad-soft: #402222;
  --panel: #0A1621; --panel-2: #142636; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E1A25; --surface: #15242F; --sunk: #1B2D3A; --line: #2A3F4E; --fg: #E4EDF3; --muted: #9DB1C0;
  --navy: #BBD6EA; --blue: #6DB9D6; --teal: #63C9BA; --accent: #6DB9D6; --accent-soft: #1B3341;
  --ok: #63CFA8; --ok-soft: #173A30; --warn: #E3B860; --warn-soft: #3B2F18; --bad: #EE9A9A; --bad-soft: #402222;

* { box-sizing: border-box; }

.btn:hover { border-color: var(--accent); }

.status { font-size: .84rem; color: var(--muted); }
.nav-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 26px; flex-wrap: wrap; }
.note { font-size: .82rem; color: var(--muted); margin: 6px 0 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.prob-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.signal { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: baseline; font-size: .87rem; }

.where { overflow-x: auto; }

<script>
const PHASES = ["Discover", "Design", "Build", "Test", "Deploy", "Operate"];
const LAYERS = [

const money = (p) => p.actions === "money";
const writes = (p) => p.actions !== "read";
const reg = (p) => p.data === "regulated";
const sensitive = (p) => p.data !== "normal";
const multi = (p) => p.tenancy === "multi";
const hasDocs = (p) => p.knowledge !== "none";

function blastRadius(p) {
  const why = [];
  if (money(p)) why.push("actions move money or can't be undone");
  else if (writes(p)) why.push("it changes things in other systems");
  else why.push("it only reads");
  if (multi(p)) why.push("many companies share it");
  if (reg(p)) why.push("auditors will ask for evidence");
  else if (sensitive(p)) why.push("it handles personal data");
  if (p.start === "modern") why.push("a running system has to keep working");
  if (atVolume(p)) why.push("volume hides mistakes");
  const level = isPilot(p) ? 0 : money(p) || (multi(p) && sensitive(p)) || (reg(p) && writes(p)) ? 2 : 1;
  return { level, label: ["Small", "Medium", "Large"][level], why };
}

/* Every control is named after the failure it prevents. */

  { id: "code", ph: "build", name: "Models don't steer the system", text: "Control flow, budgets and failure handling are ordinary, testable code. Models work only inside named steps.", on: () => true, from: "auditor", step: "agent", prompt: "Control flow, budgets and failure handling are plain code. The same inputs produce the same plan." },

  { id: "gaps", ph: "build", name: "Gaps don't get padded", text: "With no evidence, it says so and routes the gap to a person. \"No confident answer\" is a real answer, and it gets logged.", on: hasDocs, off: "No documents in this problem.", from: "compass", step: "agent", prompt: "When evidence runs out, say so and log the gap. Never pad an answer to look complete.", gate: "A question with no evidence gets an honest answer and a logged gap, shown by a test" },
  { id: "quotes", ph: "build", name: "Quotes can't be invented", text: "Plain code checks that each quoted snippet really appears on the page it cites. No model is involved in this check.", on: (p) => hasDocs(p) && (reg(p) || money(p)), off: "Citations are enough at this risk level.", from: "qi", step: "agent", prompt: "Add a plain-code check that each quoted snippet appears word for word in its cited source. A failure removes the claim and flags it.", gate: "A code test rejects a quote not found in its source" },
  { id: "decimal", ph: "build", name: "The model can't get a sum wrong", text: "Every figure is computed in exact decimals by code. If a figure is unverified, the total refuses to show a number.", on: money, off: "No money in this problem.", from: "qi", step: "domain", prompt: "All arithmetic in exact decimals in code, never in a model. If any input is unverified, block the total and say why.", gate: "Totals block when an input is unverified, shown by a test" },
  { id: "nowrite", ph: "build", name: "It can't write, because nothing lets it", text: "The client has no write method at all, and write tools are refused by name. Safe by construction, not by instruction.", on: (p) => !writes(p), off: "This problem writes, so approval gates do this job instead.", from: "compass", step: "mcp", prompt: "Give the client no write method at all, and refuse write tools by name. Prove it with an adversarial test.", gate: "A permanent test shows that write requests are refused" },
  { id: "gates", ph: "build", name: "Nothing irreversible happens unseen", text: "Agents propose, people decide. The harder a step is to undo, the more a person decides.", on: writes, off: "Reads are reversible, so no person needs to approve them.", from: "dragonfruit", step: "mcp", prompt: "Agents propose and people decide. Every write passes a named gate, placed by blast radius." },
  { id: "tiers", ph: "build", name: "People aren't buried in routine reviews", text: "Green proceeds within limits the business set. Amber queues with the evidence attached. Red waits for a named person.", on: money, off: "Nothing here is costly enough to need tiers.", from: "flick", step: "domain", prompt: "Route by confidence and amount: green proceeds within limits the business set, amber queues with evidence attached, red waits for a named person. Thresholds are code with boundary tests.", gate: "Each tier has a test just above and below its threshold" },
  { id: "idem", ph: "build", name: "A retry can't post twice", text: "Every write carries an idempotency key from the run, and is versioned and reversible.", on: writes, off: "Nothing is written.", from: "flick", step: "mcp", prompt: "Every write carries an idempotency key from the run, so a re-run or a double click does nothing.", gate: "A repeated write is a no-op, shown by a test" },
  { id: "earned", ph: "build", name: "Autonomy isn't given away early", text: "A gate graduates only on evidence, such as a high approval rate over many runs. Client-facing, financial and publishing gates never do.", on: writes, off: "There's no autonomy to grant.", from: "dragonfruit", step: "shape", prompt: "Start every gate at always-confirm. A gate graduates only on measured approval evidence, and name the gates that can never graduate." },
  { id: "critic", ph: "build", name: "One model doesn't check its own work", text: "A critic on a different vendor starts from disagreement: unsupported claims, weak citations, a tier that's too generous.", on: (p) => money(p) || reg(p), off: "Evaluation catches enough at this risk level, so a second vendor would only add cost.", from: "flick", step: "models", prompt: "Run a critic on a different model vendor, starting from disagreement. It can object and route, but never rewrite." },
  { id: "tenant", ph: "build", name: "One customer never sees another's data", text: "Tenant comes from the verified token and is enforced in the data layer, with one index per customer where it matters.", on: multi, off: "One organization, so there's no tenant boundary.", from: "auditor", step: "security", prompt: "Take the tenant only from the verified token. Scope every query, cache key and stored ID by tenant. Prefer one index per customer where isolation matters.", gate: "Cross-tenant retrieval is proved impossible with no model involved" },
  { id: "role", ph: "build", name: "A tool can't widen what a role allows", text: "Effective access is the person's own role intersected with the tool's scope, and doors fail closed.", on: (p) => sensitive(p) || multi(p) || atVolume(p), off: "Everyone at this size sees the same documents.", from: "compass", step: "security", prompt: "Effective access is the user's role intersected with the tool scope. Validate signature, tenant, audience, expiry and scope, and refuse anything you can't place.", gate: "A user outside the role is refused, shown by a test" },
  { id: "pii", ph: "build", name: "Personal data doesn't reach the model", text: "Names, phones and identifiers are redacted on the way in, before embedding.", on: sensitive, off: "No personal data in this problem.", from: "flick", step: "security", prompt: "Redact personal data at ingress, before embedding or any model call." },
  { id: "budget", ph: "build", name: "A runaway run can't drain the budget", text: "Token budgets per run, per agent and per model. The run halts when it hits them.", on: (p) => atVolume(p) || money(p) || multi(p), off: "At this size, a subscription budget alert is enough.", from: "flick", step: "models", prompt: "Set token budgets per run, agent and model, and halt the run when one is exceeded." },

  { id: "replay", ph: "build", name: "A past decision can't be unexplained", text: "Model, prompt and tool versions are pinned per run, so any decision can be replayed.", on: (p) => money(p) || reg(p), off: "Version tags on the release are enough.", from: "flick", step: "agent", prompt: "Pin model, prompt and tool versions per run, so any decision can be replayed exactly.", gate: "One past run has been replayed and matched" },
  { id: "breaker", ph: "build", name: "A slow tool can't stall the queue", text: "Timeouts at each layer, and breakers that degrade to a cached read or a deferred run. A second provider as fallback.", on: (p) => money(p) || atVolume(p), off: "At this volume, a clear error message is enough.", from: "flick", step: "mcp", prompt: "Add timeouts at every layer and circuit breakers that degrade to a cached read or deferral. Name a fallback model provider." },
  { id: "region", ph: "build", name: "Data doesn't leave its region", text: "Models and retrieval run in-region, and data stays in the tenant.", on: sensitive, off: "No residency requirement in this problem.", from: "compass", step: "models", prompt: "Keep models and retrieval in the required region. Confirm the deployment type really does this." },
  { id: "offswitch", ph: "build", name: "The business doesn't stop if the agents do", text: "The existing process keeps working with every agent switched off, and one switch turns them all off.", on: (p) => writes(p) || p.start === "modern", off: "A read-only assistant can simply be unavailable.", from: "dragonfruit", step: "experience", prompt: "The existing process must keep working with every agent off. Add one kill switch that disables them all.", gate: "The kill switch has been tried, and the existing process still worked" },

  { id: "golden", ph: "test", name: "Good demos don't pass for good systems", text: "A golden set labelled by the people who own the process, weighted toward the hard cases.", on: () => true, from: "flick", step: "evals", prompt: "The people who own the process label the golden set. Weight it toward the hard cases rather than the easy majority." },
  { id: "battery", ph: "test", name: "A change can't quietly break something", text: "A release battery of exact pass or fail cases, written before changes. Nothing ships without a green run.", on: (p) => !isPilot(p), off: "A small golden set is enough to learn from in a pilot.", from: "compass", step: "tests", prompt: "Write a release battery of exact pass or fail cases before changing behaviour. Nothing ships without a green run." },
  { id: "judge", ph: "test", name: "The grader can't drift unnoticed", text: "An LLM judge graded against human review on a small fixed set, and pinned.", on: (p) => !isPilot(p), off: "In a pilot, you read the answers yourself.", from: "compass", step: "evals", prompt: "Calibrate the LLM judge against human review on a small fixed set. Report the agreement, and pin that set.", gate: "Judge agreement with human reviewers has been measured" },
  { id: "attacks", ph: "test", name: "Yesterday's attack can't work again", text: "Permanent adversarial cases: injection, disclosure, escalation and tool misuse. They run on every release.", on: () => true, from: "compass", step: "scans", prompt: "Keep permanent adversarial cases for injection, disclosure, authority-framed requests, role escalation and tool misuse. Every successful attack becomes one more." },
  { id: "planted", ph: "test", name: "Fabrication can't slip through", text: "Tests that try to sneak in a wrong figure or a mismatched source, and must be caught.", on: (p) => money(p) || reg(p), off: "The citation checks cover this at this risk level.", from: "qi", step: "tests", prompt: "Add adversarial tests that plant a wrong figure, a missing source and a mismatched source. All must be caught.", gate: "All planted errors are caught" },

  { id: "rollback", ph: "ship", name: "A bad release can't get stuck", text: "A known-good tag or deploy you can return to with one command. Exercised, not assumed.", on: () => true, from: "compass", step: "ship", prompt: "Keep a reproducible known-good release, and make rollback one command." },
  { id: "version", ph: "ship", name: "Nobody has to guess what's running", text: "Health endpoint reports the live version, with semantic version tags and decision records.", on: (p) => !isPilot(p), off: "One environment and a short README will do for now.", from: "compass", step: "container", prompt: "The health endpoint reports the live version. Use semantic version tags and record decisions as ADRs." },
  { id: "supply", ph: "ship", name: "A dependency can't bring in a surprise", text: "Pinned dependencies, a dependency audit, an SBOM per build, and a secret scan over the whole history.", on: (p) => !isPilot(p), off: "A secret scan and a lockfile are the pilot's minimum.", from: "compass", step: "scans", prompt: "Pin dependencies, audit them, produce an SBOM per build, and scan the whole git history for secrets.", gate: "An SBOM is produced by each build" },

  { id: "statsonly", ph: "ship", name: "Traces don't become a data leak", text: "Traces hold statistics, never business content.", on: sensitive, off: "No sensitive content to protect in traces.", from: "compass", step: "observe", prompt: "Traces hold statistics, tools called, checks and timings, never business content." },

  modern: { name: "Modernizing a running app", match: (p) => p.start === "modern", risk: "Breaking what already works while adding what's new.", first: "What has to keep working if every agent is switched off?", leave: "No big-bang cutover, and no redesign during the move. Change one thing at a time so you always know what broke it.", build: "I keep the existing process running and build the AI beside it, so agents are additive.", test: "Before anything moves, I record what the system does today, so any change in behaviour shows up.", ship: "I move one slice at a time behind a flag, run it in shadow, compare, then shift traffic.", proof: ["dragonfruit", "In Dragonfruit, the pipeline works without agents, and agents are additive. That one sentence set the blast radius."] },
  money: { name: "Money moves", match: money, risk: "A confident wrong posting that nobody checks, or one posted twice.", first: "Which amounts can proceed with no person involved, and who signs off that limit? The business sets that number, not engineering.", leave: "No model does arithmetic, and disputes or reversals never automate, however good the scores look.", build: "Code owns every number, and work routes green, amber or red, so people only see what needs judgement.", test: "The golden set leans toward the hard cases, and I plant wrong figures to prove they get caught.", ship: "A small canary against baseline, a staged ramp and automatic rollback. A person reviews a rolling sample afterwards.", proof: ["flick", "On Flick, green posts within limits finance set, amber queues with the evidence attached, and red waits for a named person."] },
  saas: { name: "Multi-tenant SaaS", match: multi, risk: "One customer's data reaching another through retrieval, a cache or a stored ID.", first: "Which customers need their own resources, and will they pay for it?", leave: "No dedicated stack per tenant by default. Offer tiers, and share by default.", build: "Tenant comes from the verified token and gets enforced in the data layer, before anything reaches a model.", test: "Isolation tests run with no model at all. If a test passes only because a model refused, it's a failure.", ship: "One tenant first, per-tenant quotas, and cost tagged per customer.", proof: ["auditor", "On the Auditor, each project has its own index, so evidence from one customer can't appear in another's pack."] },
  regulated: { name: "Regulated knowledge", match: reg, risk: "An answer that sounds right but can't be defended to an auditor.", first: "What would an auditor ask to see for any one answer, and can we produce it?", leave: "No content in traces, and no autonomy that hasn't been earned.", build: "Closed-book answers: every claim quotes its source, and plain code checks each quote word for word.", test: "A judge calibrated against human review, and a fixed set of attacks that runs on every release.", ship: "Evidence ships with each release: scores, approver and an append-only trail.", proof: ["auditor", "On the Auditor, every quotation is checked letter for letter against its source, and missing evidence becomes a request to the client."] },
  write: { name: "Agents that write", match: writes, risk: "A well-meant action in the wrong place: the message sent, the schedule changed.", first: "Which actions can never be automated, whatever the approval rate?", leave: "No heavy canary machinery yet at this volume. One team with confirmation on every write teaches you more.", build: "Agents propose and people decide, and every write passes a named gate.", test: "I test that writes refuse without approval, and that repeated writes do nothing.", ship: "One team first. Gates graduate only on evidence, and some never graduate.", proof: ["dragonfruit", "In Dragonfruit, seven gates control every write, and client-facing, financial and publishing gates never graduate."] },
  readscale: { name: "Read-only with real stakes", match: (p) => !writes(p) && (atVolume(p) || sensitive(p)), risk: "People stop checking: confident wrong answers, quiet drift, or seeing beyond their role.", first: "Whose permissions apply when it reads?", leave: "No human approval on reads. A read is reversible and scoping is enforced in code, so a person adds delay and no safety.", build: "It can't write because no write path exists. Figures are computed in code, and access follows the person.", test: "A release battery gates every change and a judge is calibrated to human review. Attacks run every night.", ship: "The battery re-tests production every night, and one command takes you back to a known-good release.", proof: ["compass", "Compass has no write method at all, and re-tests production every night. A failing night files its own issue."] },
  pilot: { name: "Pilot", match: () => true, risk: "Spending months proving what two weeks could test, or letting a demo become production by accident.", first: "What result would make us stop, and who decides?", leave: "No canary, gateway or second vendor yet. Write down what must be added before a wider rollout, so that it's a decision and not an accident.", build: "One thin path with citations and an honest \"I don't know\", on real documents.", test: "A small golden set labelled by the process owner, plus a handful of attacks. I read the answers myself.", ship: "One environment, real users and a rollback, with a written list of what production would still need.", proof: ["dragonfruit", "In Dragonfruit, quick wins came in the first fortnight, and demo mode meant development never waited on API access."] }

/* The principal's call at each step. */
const CALLS = {
  contract: { call: () => "Write the rules down first. The agent follows what's written, so your standard goes in AGENTS.md on day one, sized to this problem's blast radius.", proof: ["compass", "Compass keeps six ADRs and a written OWASP assessment alongside fourteen gated releases."] },
  toolbelt: { call: () => "Give it read access to everything it needs to reason, and write access to nothing until that's earned. Treat each MCP server as attack surface.", proof: ["flick", "Each MCP server has its own narrow service account, and tool surfaces are audited for bloat before each release."] },
  frame: { call: (p) => "Ask what happens if this is wrong before you ask what it should do. That answer sets the weight of everything after it." + (p.start === "modern" ? " Here, also ask what must keep working." : ""), proof: ["dragonfruit", "Discovery came from a time audit and a survey, so the problem was measured rather than assumed."] },
  shape: { call: (p) => (money(p) ? "Choose the fixed path first. Add specialists with one job each where the work needs different evidence, and keep the supervisor as plain code." : !writes(p) ? "Don't call it an agent if retrieval does the job. A read-only job doesn't need autonomy." : "One agent with few tools and a person on every write. Add agents only when one clearly hits its limits."), proof: ["auditor", "The supervisor is plain code, so the same inputs produce the same plan, and a run never stalls on an agent's indecision."] },
  map: { call: () => "Draw it before you build it. Blurry boundaries are where the design isn't finished. Pay most attention to who decides at each boundary." },
  runtime: { call: (p) => (p.priority === "control" || money(p) ? "Keep the logic in your own code and use Foundry for models, search and tracing, so the guarantees don't depend on any runtime." : "Take the managed route until it stops you. The guarantees live in your tools and domain code either way, so you can move later."), proof: ["compass", "A FastAPI engine on App Service calls models on Azure AI Foundry, and one deployable serves every front door."] },
  hosting: { call: (p) => (p.start === "modern" ? "Land the existing app somewhere simple first. Don't change hosting and behaviour in the same release." : "Choose the simplest host that gives you traffic splitting and rollback. Pick it for how you'll recover, not how you'll start."), proof: ["flick", "Flick and the Playground run on Container Apps. Compass runs on App Service. The requirement decided each one, not a default."] },
  knowledge: { call: (p) => (p.knowledge === "graph" ? "Prove GraphRAG beats plain search on your labelled questions before paying for it." : multi(p) ? "Decide isolation before chunking. It's far harder to change later." : "Start with the simplest retrieval that passes your labelled questions, and measure before tuning."), proof: ["bedrock", "Retrieval grades itself and retries before answering, and CI refuses a regression."] },
  models: { call: (p) => (money(p) || reg(p) ? "Use a second vendor to check the first, because two different models rarely misread the same thing the same way." : atVolume(p) ? "Route by job. Simple extraction shouldn't pay premium rates." : "One model until cost says otherwise. Routing is complexity you have to test."), proof: ["playground", "A router sends each request to an Economy, Workhorse or Premium model, and every call gets a cost row."] },
  security: { call: () => "Assume the model will be tricked, then ask how much damage it can do. Enforce the answer in code, inside the tool, using identity from the verified token.", proof: ["compass", "Effective access is role intersected with tool pack, and twelve permanent attack cases run every night."] },
  batches: { call: (p) => (isPilot(p) ? "Plan for two weeks, one path and real users. Everything else goes on a written later list." : "Each batch ends with something running and evidence on file. Put the riskiest assumption near the front."), proof: ["compass", "Fourteen releases in fourteen weeks, each one gated and reversible in a single command."] },
  scaffold: { call: () => "Make it run with no cloud access first. If development waits on API keys and access requests, you lose the first week.", proof: ["dragonfruit", "Demo mode meant development never waited on client API access, and connectors swapped in when keys arrived."] },
  infra: { call: (p) => "Infrastructure from code from the first day, even for a pilot, because rebuilding from the portal is what really costs you." + (p.iac === "none" ? " Use the client's standard if they have one. If not, pick one and move on, since the design matters more than the language." : ""), proof: ["flick", "Flick is Bicep infrastructure as code, with parity from dev to production."] },
  domain: { call: (p) => (money(p) ? "Write this before any prompt. Every figure and threshold is plain code with tests just above and below each limit." : "Write the rules before any prompt, however few there are. The model can propose, and code applies the rule."), proof: ["qi", "Arithmetic runs in exact decimals, and the headline total refuses to show a number while any row is unconfirmed."] },
  mcp: { call: (p) => (writes(p) ? "Four to eight tools per server, in business language. Every unused tool is routing noise, attack surface and tokens." : "Make writes impossible rather than discouraged. Then the heaviest controls can focus on who may see what."), proof: ["flick", "One server per system of record, four to eight typed tools each, and each agent sees only the servers its job needs."] },
  agent: { call: () => "Budget the context rather than filling it. The agent gets instructions, the evidence for this step and little else. Test the loop with a fake model.", proof: ["auditor", "The writer sees only evidence retrieved from this project, and a separate critic reviews its work."] },
  experience: { call: (p) => (money(p) ? "Reviewers should see a variance table and citations, not a transcript, so routine approvals take seconds." : p.channel === "teams" ? "Go where people already work. Adoption is the metric that kills most pilots." : "Show progress, sources and confidence. People trust what they can check."), proof: ["flick", "Routine approvals take seconds, because reviewers see the variance table and citations in Teams."] },

      h += '<div class="layer"><div class="layer-name" style="background:var(--l' + l.n + ')"><b>' + l.n + " " + esc(l.name) + "</b><small>" + esc(l.q) + '</small></div><div class="layer-body"><div>' + (dec || '<span class="k">No choice attached yet</span>') + '</div><div><span class="k">Proved by:</span> ' + esc(l.tests) + '</div></div><div class="layer-state"><span class="pill ' + st[1] + '">' + st[0] + "</span></div></div>";
    });
    h += '<div class="gov"><b>Governance, across every layer.</b> Can we prove the system did the right thing? Policies, approvals, audit trails and evidence. Release gates need an evaluation pass and a named approver. Steps: ' + STEPS.filter((s) => s.gov).map((s) => '<button class="link" type="button" data-step="' + s.id + '">' + esc(s.short) + "</button>").join(", ") + ".</div></div>";
    h += '<section class="sec"><div class="sec-h"><h2>The boundaries</h2><small>The hard design work sits here</small></div><div class="where"><table><thead><tr><th>Boundary</th><th>The question</th><th>The rule</th><th>Your design</th></tr></thead><tbody>' + BOUNDARIES.map((b) => "<tr><td><b>" + esc(b[0]) + "</b></td><td>" + esc(b[1]) + "</td><td>" + esc(b[2]) + "</td><td>" + esc(b[3](S.p, decisions(), dname)) + "</td></tr>").join("") + "</tbody></table></div></section>";
    h += '<section class="sec cols"><div><div class="sec-h"><h2>Scans</h2></div><div class="where"><table><thead><tr><th>Scan</th><th>When</th><th>Layers</th><th>Tool</th></tr></thead><tbody>' + SCANS.map((r) => "<tr><td>" + r.map(esc).join("</td><td>") + "</td></tr>").join("") + '</tbody></table></div><p class="note">A high-severity finding blocks the merge. Lower findings open a ticket with an owner and a due date.</p></div><div><div class="sec-h"><h2>Automated tests</h2></div><div class="where"><table><thead><tr><th>Test</th><th>Proves</th><th>Layers</th></tr></thead><tbody>' + TESTS.map((r) => "<tr><td>" + r.map(esc).join("</td><td>") + "</td></tr>").join("") + '</tbody></table></div><p class="note">Nothing ships unless the evaluation gate passes, and every failure becomes a new test case.</p></div></section>';
    view.innerHTML = h;
  }

  /* ---------- Decisions and cost ---------- */
  function viewDecisions() {
    const lines = costLines(), tot = totalCost(), mx = Math.max(1, ...lines.map((l) => l.amt));
    let h = '<div class="head"><div><div class="eyebrow">' + esc(S.name) + '</div><h1>Decisions and cost</h1><p>Your decision record so far, and what it costs at list price. Change a choice in the journey and the numbers follow.</p></div><div style="text-align:right"><div class="status">Estimated run cost</div><div style="font-family:var(--serif);font-size:2rem;color:var(--navy)">' + money(tot) + '<span class="status">/month</span></div></div></div>';
    h += '<div class="cols"><div class="panel"><div class="sec-h"><h2>What moves the bill</h2></div>' + [["c-req", "Requests a day", "reqDay", 50, 50000, 50], ["c-in", "Input tokens per request", "tokIn", 500, 40000, 500], ["c-out", "Output tokens per request", "tokOut", 100, 8000, 100], ["c-ten", "Tenants", "tenants", 1, 200, 1]].map((f) => '<div class="range"><label for="' + f[0] + '">' + f[1] + '</label><input id="' + f[0] + '" data-range="' + f[2] + '" type="range" min="' + f[3] + '" max="' + f[4] + '" step="' + f[5] + '" value="' + S.p[f[2]] + '"><output>' + S.p[f[2]].toLocaleString("en-US") + "</output></div>").join("") + '<div class="where" style="margin-top:10px"><table><thead><tr><th>Line</th><th class="num">Per month</th><th style="width:30%"></th></tr></thead><tbody>' + lines.map((l) => "<tr><td><b>" + esc(l.label) + "</b>: " + esc(l.opt) + '<br><span class="status">' + esc(l.note) + '</span></td><td class="num">' + money(l.amt) + '</td><td><div class="costbar" style="width:' + (l.amt / mx) * 100 + '%"></div></td></tr>').join("") + '</tbody></table></div><p class="note">' + esc(COST_NOTE) + "</p></div>";
    h += '<div class="panel"><div class="sec-h"><h2>Decision record</h2><small>Goes into docs/decisions</small></div>' + STEPS.filter((s) => s.options && s.options.length).map((s) => { const o = chosen(s), r = o.fit(S.p, decisions()); return '<div class="packitem"><div><button class="link" type="button" data-step="' + s.id + '">' + esc(s.short) + "</button>: <b>" + esc(o.name) + "</b>" + (S.choices[s.id] ? "" : ' <span class="pill">default</span>') + '<div class="status">' + esc(r[1]) + "</div></div></div>"; }).join("") + "</div></div>";
    view.innerHTML = h;
    view.querySelectorAll("[data-range]").forEach((r) => { r.oninput = () => { S.p[r.dataset.range] = +r.value; save(); render(); const el = view.querySelector('[data-range="' + r.dataset.range + '"]'); if (el) el.focus(); }; });
  }

  /* ---------- Prompt pack ---------- */
  function packText() {
    return "# Prompt pack: " + S.name + "\n\nProblem: " + S.problem + "\n\n" + STEPS.map((s, i) => "## " + (i + 1) + ". " + PHASES[s.phase] + ": " + s.title + "\n\n```text\n" + strip(compose(s)) + "\n```\n").join("\n");
  }
  function viewPack() {
    let h = '<div class="head"><div><div class="eyebrow">' + esc(S.name) + '</div><h1>The prompt pack</h1><p>All ' + N + ' prompts with your decisions built in, ready to paste in order. Start with the first one. It sets up the working contract that the rest rely on.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" id="copy-all">Copy all</button>' + (downloads ? '<button class="btn" type="button" id="save-all">Save as Markdown</button>' : "") + '</div></div><div class="panel"><div id="pack-status" class="status"></div>';
    h += STEPS.map((s, i) => '<div class="packitem"><span><span class="mono status">' + (i + 1) + "</span> <b>" + esc(s.title) + '</b> <span class="status">· ' + PHASES[s.phase] + (chosen(s) ? " · " + esc(chosen(s).name) : "") + '</span></span><span style="display:flex;gap:6px"><button class="btn" type="button" data-copy-step="' + s.id + '">Copy</button><button class="btn" type="button" data-step="' + s.id + '">Open</button></span></div>').join("");
    h += "</div>";
    view.innerHTML = h;
    $("copy-all").onclick = (e) => copyText(packText(), e.currentTarget, null);
    const sv = $("save-all");
    if (sv) sv.onclick = async () => { try { await downloads.save({ filename: slugify(S.name) + "-prompt-pack.md", data: packText() }); $("pack-status").textContent = "Saved."; } catch (e) { $("pack-status").textContent = e && e.code === "declined" ? "Save cancelled." : "That save didn't work here. Use Copy all instead."; } };
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-view],[data-step],[data-opt],[data-tool],[data-signal],[data-sample],[data-copy-step]");
    if (!t) return;
    if (t.dataset.view) return go(t.dataset.view);
    if (t.dataset.step) return go("journey", t.dataset.step);
    if (t.dataset.tool) { S.tool = t.dataset.tool; save(); return render(); }
    if (t.dataset.opt) { S.choices[S.step] = t.dataset.opt; save(); stopPlay(); return render(); }
    if (t.dataset.signal) { S.p[t.dataset.signal] = t.dataset.value; S.choices = {}; contextChanged(); save(); return render(); }
    if (t.dataset.copyStep) { const s = STEPS[stepIndex(t.dataset.copyStep)]; return copyText(strip(compose(s)), t, null); }
    if (t.dataset.sample) {
      const keepTool = S.tool, n = fresh(+t.dataset.sample);
      n.tool = keepTool; n.view = "problem"; S = n; save(); return render();
    }
  });
  document.addEventListener("change", (e) => {
    const n = e.target.dataset && e.target.dataset.gate;
    if (n === undefined) return;
    const g = (S.gates[S.step] = S.gates[S.step] || {}); g[gateLines(STEPS[stepIndex(S.step)])[+n]] = e.target.checked; save(); renderBar();
    const step = STEPS[stepIndex(S.step)];
    if (stepDone(step)) render();
  });
  function fromHash() {
    const h = location.hash.replace("#", "");
    if (!h) return;
    if (TABS.some((t) => t[0] === h)) S.view = h;
    else if (stepIndex(h) >= 0) { S.view = "journey"; S.step = h; }
  }
  window.addEventListener("hashchange", () => { fromHash(); render(); });
  fromHash();
  render();
})();
</script>

</html>
